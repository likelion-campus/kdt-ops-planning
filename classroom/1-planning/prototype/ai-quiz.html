<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>학습퀴즈 — 프로토타입 v2.4</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" />
  <link rel="stylesheet" href="./assets/tokens.css" />
  <link rel="stylesheet" href="./assets/styles.css" />
  <script src="./assets/mock-data.js"></script>
  <script src="./assets/components.js"></script>
</head>
<body>
  <script>
    const { root, view } = UI.renderShell('ai-quiz');
    UI.renderPageHead(root, {
      title: '학습퀴즈',
      subtitle: '학습한 내용을 퀴즈로 점검해보세요.',
    });

    // 응시(풀이) 시간 포맷 — 초 → "N분 N초" / "N초". 목표: 전체 ≈ 15분(MOCK.quizTargetSec)
    function fmtDur(sec) {
      if (sec == null) return '-';
      const m = Math.floor(sec / 60), s = Math.round(sec % 60);
      return m ? (s ? `${m}분 ${s}초` : `${m}분`) : `${s}초`;
    }
    // 문항별 난이도 라벨 — 평균 응시시간 기준 (길수록 어려움)
    function diffByTime(sec) {
      if (sec >= 120) return { label: '어려움', cls: 'tag-weak-error' };
      if (sec >= 80) return { label: '보통', cls: 'tag-weak-warning' };
      return { label: '쉬움', cls: 'tag-weak-success' };
    }

    if (view === 'trainee') renderTrainee(); else renderManager();

    // ============================================================
    // 학생뷰 — 3탭
    // ============================================================
    function renderTrainee() {
      const tabs = [
        { key: 'today', label: '학습퀴즈' },
        { key: 'wrong', label: '오답노트' },
        { key: 'supp', label: '보충 퀴즈' },
      ];
      const st = UI.loadState();
      const active = st.quizTab || 'today';

      const tabsEl = document.createElement('div');
      tabsEl.className = 'tabs';
      tabsEl.style.justifyContent = 'center'; // 학습퀴즈·오답노트·보충 퀴즈 탭 가운데 정렬
      tabs.forEach((t) => {
        const btn = document.createElement('button');
        btn.className = 'tab' + (active === t.key ? ' is-active' : '');
        btn.textContent = t.label;
        btn.addEventListener('click', () => { UI.saveState({ quizTab: t.key }); location.reload(); });
        tabsEl.appendChild(btn);
      });
      root.appendChild(tabsEl);

      const body = document.createElement('section');
      body.style.marginTop = '24px';
      root.appendChild(body);

      if (active === 'today') renderTodayTab(body);
      else if (active === 'wrong') renderWrongTab(body);
      else renderSuppTab(body);
    }

    // ===== 학습퀴즈 탭 =====
    function renderTodayTab(body) {
      // 데모 상태 토글 (출제전 · 오전 퀴즈 발행 · 추가 퀴즈 발행 · 내제출후)
      const st = UI.loadState();
      const demoState = st.todayDemo || 'pre-publish';
      const toggle = UI.demoStateToggle(
        [
          { value: 'pre-publish', label: '출제 전' },
          { value: 'morning', label: '오전 퀴즈 발행' },
          { value: 'added', label: '추가 퀴즈 발행' },
          { value: 'after-submit', label: '내 제출 후' },
        ],
        demoState,
        (v) => { UI.saveState({ todayDemo: v }); location.reload(); }
      );
      body.appendChild(toggle);

      const sid = MOCK.activeStudentId;
      const today = MOCK.meta.today;
      const SEP = '<span style="color:var(--lk-color-fg-disabled); font-weight:400; margin:0 8px;">|</span>';

      if (demoState === 'pre-publish') {
        const todayCard = document.createElement('div');
        todayCard.className = 'card';
        todayCard.style.marginBottom = '32px';
        todayCard.innerHTML = `
          <div class="card-head">
            <div>
              <div class="card-meta">${UI.fmtDate(today)}</div>
              <h3 class="card-title" style="margin-top: 6px;">학습퀴즈</h3>
            </div>
            <span class="tag tag-weak-neutral">발행 대기</span>
          </div>
          <div class="empty" style="padding: 24px;">
            <div class="icon"><i class="ri-icon ri-time-line"></i></div>
            <h4>아직 퀴즈가 발행되지 않았어요</h4>
            <p>매일 <strong>08:30</strong>에 자동 발행됩니다</p>
          </div>
        `;
        body.appendChild(todayCard);
      } else {
        // 학습퀴즈는 하루에 여러 개 발행될 수 있음 → 발행된 세트마다 블럭 표시
        // morning = 오전 퀴즈만(1개) / added·after-submit = 추가 발행(2개)
        const solved = demoState === 'after-submit';
        const blockCount = demoState === 'morning' ? 1 : 2;
        const sets = (MOCK.quizzes[today]?.sets || []).slice(0, blockCount);
        const blocks = sets.length ? sets : [{ id: `${today}-set-auto`, title: MOCK.aiNotes[today]?.title || '퀴즈' }];

        const head0 = document.createElement('div');
        head0.className = 'section-head';
        head0.style.margin = '0 0 12px';
        const hint = blockCount === 1 ? '오전 자동 발행 1개' : `발행 ${blocks.length}개 · 추가 발행됨`;
        head0.innerHTML = `<h3>학습퀴즈</h3><span class="hint">${UI.fmtDate(today)} · ${hint}</span>`;
        body.appendChild(head0);

        const blockWrap = document.createElement('div');
        blockWrap.style.cssText = 'display:flex; flex-direction:column; gap:16px; margin-bottom:32px;';
        blocks.forEach((set, i) => {
          const title = set.title || (MOCK.aiNotes[today]?.title || '퀴즈');
          const ctx = { title: `학습퀴즈 · ${title}`, backLabel: '학습퀴즈' };
          const card = document.createElement('div');
          card.className = 'card';
          // 데모: after-submit이면 첫 블럭만 응시 완료, 나머지는 미응시 → 블럭별 상태 차이를 보여줌
          const blockSolved = solved && i === 0;
          if (blockSolved) {
            const attempt = MOCK.attempts[sid]?.[today] || { submitted: true, score: 7, submittedAt: today + 'T09:18', durationSec: 840, wrongIds: [`${today}-q3`, `${today}-q5`, `${today}-q7`] };
            card.innerHTML = `
              <div class="card-head">
                <div><h3 class="card-title">학습퀴즈${SEP}<span data-slot="bt"></span></h3></div>
                <span class="tag tag-small tag-weak-success">응시 완료</span>
              </div>
              <div class="row" style="gap: 32px; margin-top: 12px; align-items: center;">
                <div><div class="card-meta">점수</div><div style="font-size: 24px; font-weight: 700; margin-top: 4px;" data-slot="score"></div></div>
                <div><div class="card-meta">정답률</div><div style="font-size: 24px; font-weight: 700; margin-top: 4px;" data-slot="rate"></div></div>
                <div><div class="card-meta">풀이 시간</div><div style="font-size: 24px; font-weight: 700; margin-top: 4px;" data-slot="dur"></div></div>
                <div><div class="card-meta">제출 시각</div><div style="font-size: 14px; margin-top: 6px;" data-slot="time"></div></div>
                <div style="margin-left: auto;" id="result-btn-${i}"></div>
              </div>
            `;
            card.querySelector('[data-slot="bt"]').textContent = title;
            card.querySelector('[data-slot="score"]').textContent = `${attempt.score} / 10`;
            card.querySelector('[data-slot="rate"]').textContent = `${attempt.score * 10}%`;
            card.querySelector('[data-slot="dur"]').textContent = fmtDur(attempt.durationSec);
            card.querySelector('[data-slot="time"]').textContent = UI.relTime(attempt.submittedAt);
            card.querySelector(`#result-btn-${i}`).appendChild(
              UI.button({ label: '결과·해설 보기', icon: 'ri-arrow-right-line', type: 'outline', color: 'neutral', onClick: () => openResult(today, attempt, ctx) })
            );
          } else {
            card.innerHTML = `
              <div class="card-head">
                <div><h3 class="card-title">학습퀴즈${SEP}<span data-slot="bt"></span>${SEP}객관식 10문제</h3></div>
              </div>
              <div id="start-btn-${i}" style="margin-top: 16px;"></div>
            `;
            card.querySelector('[data-slot="bt"]').textContent = title;
            card.querySelector(`#start-btn-${i}`).appendChild(
              UI.button({ label: '풀기', icon: 'ri-play-circle-line', size: 'large', type: 'solid', color: 'primary', onClick: () => openTaking(today, ctx) })
            );
          }
          blockWrap.appendChild(card);
        });
        body.appendChild(blockWrap);
      }

      // 과거 응시 결과 — 페이지네이션 (20/50/100)
      const head = document.createElement('div');
      head.className = 'section-head';
      head.innerHTML = '<h3>과거 응시 결과</h3><span class="hint">클릭하면 결과 + 해설을 바로 볼 수 있어요</span>';
      body.appendChild(head);

      // 생성 실패 퀴즈는 학생뷰에서 숨김 (그날 퀴즈가 없는 것과 동일하게 처리) — W1
      const pastDates = MOCK.days.filter((d) => d !== today && MOCK.quizzes[d] && MOCK.quizzes[d].status !== 'generation_failed').sort().reverse();
      if (pastDates.length === 0) {
        body.appendChild(UI.emptyCard({ icon: 'ri-list-check-2', title: '아직 응시 이력이 없어요', body: '첫 퀴즈가 발행되면 여기에 누적됩니다.' }));
        return;
      }

      const pastControls = document.createElement('div');
      pastControls.className = 'row';
      pastControls.style.cssText = 'margin-bottom: 12px; justify-content: flex-end;';
      pastControls.innerHTML = '<div id="past-size"></div>';
      body.appendChild(pastControls);

      const list = document.createElement('div');
      list.className = 'note-list';
      body.appendChild(list);
      const pastPager = document.createElement('div');
      pastPager.style.cssText = 'display:flex; align-items:center; justify-content:center; gap:14px; margin-top:20px;';
      body.appendChild(pastPager);

      let pastSize = 20, pastPage = 1;
      pastControls.querySelector('#past-size').appendChild(
        UI.select({ options: [{ value: 20, label: '20개씩' }, { value: 50, label: '50개씩' }, { value: 100, label: '100개씩' }], value: 20, onChange: (v) => { pastSize = v; pastPage = 1; drawPast(); } })
      );

      function drawPast() {
        const totalPages = Math.max(1, Math.ceil(pastDates.length / pastSize));
        if (pastPage > totalPages) pastPage = totalPages;
        list.innerHTML = '';
        const start = (pastPage - 1) * pastSize;
        pastDates.slice(start, start + pastSize).forEach((d) => {
          const a = MOCK.attempts[sid]?.[d];
          const row = document.createElement('div');
          row.className = 'quiz-row';
          const status = !a?.submitted ? { tag: 'tag-weak-neutral', label: '미응시' } : { tag: 'tag-weak-success', label: `${a.score} / 10` };
          row.innerHTML = `
            <div class="quiz-date"><i class="ri-icon ri-calendar-line"></i><span data-slot="d"></span></div>
            <div class="quiz-title" data-slot="t"></div>
            <span class="tag tag-small ${status.tag}" data-slot="s"></span>
          `;
          row.querySelector('[data-slot="d"]').textContent = UI.fmtDate(d);
          row.querySelector('[data-slot="t"]').textContent = MOCK.aiNotes[d]?.title || '퀴즈';
          row.querySelector('[data-slot="s"]').textContent = status.label;
          row.addEventListener('click', () => {
            if (!a?.submitted) { openTaking(d); return; }
            openResult(d, a);
          });
          list.appendChild(row);
        });
        pastPager.innerHTML = '';
        pastPager.appendChild(UI.button({ label: '이전', icon: 'ri-arrow-left-s-line', type: 'ghost', color: 'neutral', size: 'small', disabled: pastPage <= 1, onClick: () => { pastPage--; drawPast(); } }));
        const lbl = document.createElement('span');
        lbl.style.cssText = 'font-size:13px; color:var(--lk-color-fg-neutral); min-width:120px; text-align:center;';
        lbl.textContent = `${pastPage} / ${totalPages} · 총 ${pastDates.length}건`;
        pastPager.appendChild(lbl);
        pastPager.appendChild(UI.button({ label: '다음', icon: 'ri-arrow-right-s-line', type: 'ghost', color: 'neutral', size: 'small', disabled: pastPage >= totalPages, onClick: () => { pastPage++; drawPast(); } }));
      }
      drawPast();
    }

    // ===== 오답노트 탭 — 객관식 문제 카드뷰 (1뎁스) =====
    function renderWrongTab(body) {
      const sid = MOCK.activeStudentId;
      const all = (MOCK.wrongNotes[sid] || []).slice().sort((a, b) => b.date.localeCompare(a.date));

      if (all.length === 0) {
        body.appendChild(UI.emptyCard({
          icon: 'ri-check-double-line',
          title: '퀴즈 응시 후 틀린 문제가 여기에 모여요',
          body: '학습퀴즈를 풀면 오답이 자동으로 누적됩니다.',
          cta: { label: 'AI 노트로 가기', onClick: () => location.href = 'ai-note.html' },
        }));
        return;
      }

      // 상단 컨트롤 — 필터탭 + 검색(문제 내용) + 페이지 크기
      const controls = document.createElement('div');
      controls.className = 'row';
      controls.style.cssText = 'margin-bottom: 16px; gap: 12px; flex-wrap: wrap; align-items: center;';
      controls.innerHTML = `
        <div id="filter-tabs"></div>
        <div class="search-field" style="margin-left:auto; min-width:240px;"><i class="ri-icon ri-search-line"></i><input type="search" id="wq" placeholder="문제 내용으로 검색" /></div>
        <div id="size-sel"></div>
      `;
      body.appendChild(controls);

      const filterTabs = document.createElement('div');
      filterTabs.className = 'tabs-round';
      filterTabs.innerHTML = `
        <button class="tab is-active" data-f="all">전체 (${all.length})</button>
        <button class="tab" data-f="today">학습퀴즈 (${all.filter((w) => w.source !== 'supp').length})</button>
        <button class="tab" data-f="supp">보충 퀴즈 (${all.filter((w) => w.source === 'supp').length})</button>
        <button class="tab" data-f="book">📌 책갈피 (${all.filter((w) => w.bookmarked).length})</button>
        <button class="tab" data-f="memo">📝 메모 (${all.filter((w) => w.memo).length})</button>
      `;
      controls.querySelector('#filter-tabs').appendChild(filterTabs);

      const grid = document.createElement('div');
      grid.className = 'wrong-card-grid';
      body.appendChild(grid);
      const pager = document.createElement('div');
      pager.style.cssText = 'display:flex; align-items:center; justify-content:center; gap:14px; margin-top:20px;';
      body.appendChild(pager);

      let filter = 'all', query = '', pageSize = 20, page = 1;
      const sizeSel = UI.select({ options: [{ value: 20, label: '20개씩' }, { value: 50, label: '50개씩' }, { value: 100, label: '100개씩' }], value: 20, onChange: (v) => { pageSize = v; page = 1; draw(); } });
      controls.querySelector('#size-sel').appendChild(sizeSel);
      const qInput = controls.querySelector('#wq');
      qInput.addEventListener('input', () => { query = qInput.value.trim().toLowerCase(); page = 1; draw(); });
      filterTabs.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
        filterTabs.querySelectorAll('button').forEach((x) => x.classList.remove('is-active'));
        b.classList.add('is-active');
        filter = b.dataset.f; page = 1; draw();
      }));

      function filtered() {
        let items = all;
        if (filter === 'today') items = items.filter((w) => w.source !== 'supp');
        if (filter === 'supp') items = items.filter((w) => w.source === 'supp');
        if (filter === 'book') items = items.filter((w) => w.bookmarked);
        if (filter === 'memo') items = items.filter((w) => w.memo);
        if (query) items = items.filter((w) => (w.stem || '').toLowerCase().includes(query) || (w.choices || []).some((c) => (c || '').toLowerCase().includes(query)) || (w.explanation || '').toLowerCase().includes(query));
        return items;
      }
      function draw() {
        const items = filtered();
        const totalPages = Math.max(1, Math.ceil(items.length / pageSize));
        if (page > totalPages) page = totalPages;
        grid.innerHTML = '';
        if (items.length === 0) {
          grid.appendChild(UI.emptyCard({ icon: 'ri-search-line', title: '검색 결과가 없어요', body: '다른 검색어나 필터를 시도해보세요.' }));
          pager.innerHTML = '';
          return;
        }
        const start = (page - 1) * pageSize;
        items.slice(start, start + pageSize).forEach((w) => grid.appendChild(buildWrongCard(w, draw)));
        pager.innerHTML = '';
        pager.appendChild(UI.button({ label: '이전', icon: 'ri-arrow-left-s-line', type: 'ghost', color: 'neutral', size: 'small', disabled: page <= 1, onClick: () => { page--; draw(); } }));
        const lbl = document.createElement('span');
        lbl.style.cssText = 'font-size:13px; color:var(--lk-color-fg-neutral); min-width:120px; text-align:center;';
        lbl.textContent = `${page} / ${totalPages} · 총 ${items.length}건`;
        pager.appendChild(lbl);
        pager.appendChild(UI.button({ label: '다음', icon: 'ri-arrow-right-s-line', type: 'ghost', color: 'neutral', size: 'small', disabled: page >= totalPages, onClick: () => { page++; draw(); } }));
      }
      draw();
    }

    function buildWrongCard(w, rerender) {
      const card = document.createElement('div');
      card.className = 'wrong-card';
      card.innerHTML = `
        <div class="top-row">
          <span style="display:inline-flex; align-items:center; gap:8px; min-width:0;">
            <span class="tag tag-small" data-slot="src-tag"></span>
            <span data-slot="meta"></span>
          </span>
          <div class="actions" id="acts"></div>
        </div>
        <div class="stem" data-slot="stem"></div>
        <div class="compact-choices" data-slot="ch"></div>
        <div class="explain" data-slot="ex"></div>
        <div data-slot="memo"></div>
      `;
      const isSupp = w.source === 'supp';
      const srcTag = card.querySelector('[data-slot="src-tag"]');
      srcTag.classList.add(isSupp ? 'tag-weak-neutral' : 'tag-weak-enabled');
      srcTag.textContent = isSupp ? '보충 퀴즈' : '학습퀴즈';
      card.querySelector('[data-slot="meta"]').textContent = `${UI.fmtDate(w.date, { short: true })} · ${w.title || MOCK.aiNotes[w.date]?.title || '퀴즈'}`;
      card.querySelector('[data-slot="stem"]').textContent = w.stem;
      const ch = card.querySelector('[data-slot="ch"]');
      w.choices.forEach((c, idx) => {
        const div = document.createElement('div');
        div.className = 'compact-choice' + (idx === w.answer ? ' is-answer' : (idx === w.userPick ? ' is-mine' : ''));
        div.textContent = `${idx + 1}. ${c}${idx === w.answer ? '   ✓ 정답' : (idx === w.userPick ? '   ✗ 내 선택' : '')}`;
        ch.appendChild(div);
      });
      card.querySelector('[data-slot="ex"]').textContent = w.explanation;
      if (w.memo) {
        const m = card.querySelector('[data-slot="memo"]');
        m.className = 'memo';
        m.textContent = '📝 ' + w.memo;
      }
      const acts = card.querySelector('#acts');
      const bm = UI.button({ label: w.bookmarked ? '📌 해제' : '책갈피', size: 'small', type: 'ghost', color: 'neutral', icon: w.bookmarked ? 'ri-bookmark-fill' : 'ri-bookmark-line', onClick: () => { w.bookmarked = !w.bookmarked; rerender(); UI.toast('책갈피 저장됨', 'success'); } });
      const mm = UI.button({ label: '메모', size: 'small', type: 'ghost', color: 'neutral', icon: 'ri-edit-2-line', onClick: () => { const t = prompt('메모 (간단히)', w.memo || ''); if (t != null) { w.memo = t; rerender(); UI.toast('메모 저장됨', 'success'); } } });
      acts.appendChild(bm);
      acts.appendChild(mm);
      return card;
    }

    // ===== 보충 퀴즈 탭 — 6개월 스크롤 + 풀이상태/정답률 + 하루 10회 한도 =====
    function renderSuppTab(body) {
      const sid = MOCK.activeStudentId;
      const sessions = MOCK.suppSessions[sid] || [];
      const limit = MOCK.suppDailySetLimit; // 하루 10회 (세트 단위)

      // 데모: 오늘 생성 횟수 상태 토글 (여유 / 한도 임박 / 오늘 한도 초과)
      const st = UI.loadState();
      const limitDemo = st.suppLimitDemo || 'normal';
      const base = { normal: 2, near: limit - 1, over: limit }[limitDemo];
      const madeToday = Math.min(limit, base + (st.suppMadeExtra || 0));
      const remaining = Math.max(0, limit - madeToday);
      const atLimit = remaining === 0;

      body.appendChild(UI.demoStateToggle(
        [
          { value: 'normal', label: '여유 있음' },
          { value: 'near', label: '한도 임박' },
          { value: 'over', label: '오늘 한도 초과' },
        ],
        limitDemo,
        (v) => { UI.saveState({ suppLimitDemo: v, suppMadeExtra: 0 }); location.reload(); }
      ));

      const intro = document.createElement('div');
      intro.className = 'card';
      intro.style.marginBottom = '24px';
      intro.innerHTML = `
        <div class="card-head" style="margin-bottom: 0;">
          <div>
            <h3 class="card-title">보충 퀴즈 만들기</h3>
            <p class="text-mute" style="font-size: 13px; margin-top: 6px;">오답을 기반으로 추가 문제를 만들어 풀 수 있어요</p>
          </div>
          <div class="row" style="gap: 12px; align-items: center;">
            <span id="create-btn"></span>
          </div>
        </div>
      `;
      const createBtnWrap = intro.querySelector('#create-btn');
      if (atLimit) {
        createBtnWrap.appendChild(UI.button({ label: '오늘은 쉬어요', icon: 'ri-cup-line', type: 'solid', color: 'neutral', size: 'medium', disabled: true, onClick: () => {} }));
      } else {
        createBtnWrap.appendChild(UI.button({ label: '+ 보충 퀴즈 출제', type: 'solid', color: 'primary', size: 'medium', onClick: () => openSuppCreate(remaining) }));
      }
      body.appendChild(intro);

      // 한도 초과 — "오늘 쉬세요" 친근한 빈상태
      if (atLimit) {
        body.appendChild(UI.emptyCard({
          icon: 'ri-cup-line',
          title: '오늘은 충분히 했어요 — 잠깐 쉬어가요 ☕',
          body: '오늘은 보충 퀴즈를 충분히 풀었어요. 내일 다시 도전해보세요!',
        }));
      }

      const head = document.createElement('div');
      head.className = 'section-head';
      head.innerHTML = `<h3>내가 만든 보충 퀴즈</h3><span class="hint">최근 6개월 · 총 ${sessions.length}세트</span>`;
      body.appendChild(head);

      if (sessions.length === 0) {
        body.appendChild(UI.emptyCard({
          icon: 'ri-add-circle-line',
          title: '아직 만든 보충 퀴즈가 없어요',
          body: '오답과 유사한 보충 퀴즈를 풀어보세요.',
          cta: { label: '보충 퀴즈 만들기', onClick: () => openSuppCreate() },
        }));
        return;
      }

      // 6개월 스크롤 가능 리스트
      const listWrap = document.createElement('div');
      listWrap.style.cssText = 'max-height: 1200px; overflow-y: auto; padding-right: 4px;';
      const list = document.createElement('div');
      list.className = 'note-list';
      sessions.forEach((set) => {
        const row = document.createElement('div');
        row.className = 'quiz-row';
        const statusTag = set.solved
          ? { cls: 'tag-weak-success', label: `정답률 ${Math.round(set.rate * 100)}%` }
          : { cls: 'tag-weak-neutral', label: '미응시' };
        const countTag = `${set.count}문제`;
        row.innerHTML = `
          <div class="quiz-date"><i class="ri-icon ri-calendar-line"></i><span data-slot="d"></span></div>
          <div class="quiz-title" data-slot="t"></div>
          <span class="tag tag-small tag-weak-neutral" data-slot="cnt"></span>
          <span class="tag tag-small ${statusTag.cls}" data-slot="st"></span>
        `;
        row.querySelector('[data-slot="d"]').textContent = UI.fmtDate(set.targetDate, { compact: true });
        row.querySelector('[data-slot="t"]').textContent = set.topic;
        row.querySelector('[data-slot="cnt"]').textContent = countTag;
        row.querySelector('[data-slot="st"]').textContent = statusTag.label;
        row.addEventListener('click', () => openSuppDetail(set));
        list.appendChild(row);
      });
      listWrap.appendChild(list);
      body.appendChild(listWrap);
    }

    // ============================================================
    // 보충 퀴즈 생성 — 풍부한 날짜 select (날짜·핵심 개념·점수)
    // ============================================================
    function openSuppCreate(remaining, presetDates) {
      const sid = MOCK.activeStudentId;
      const fp = UI.openFullPage({ backLabel: '학습퀴즈' });

      // 응시 이력 있는 날짜만 옵션으로
      const opts = MOCK.days.filter((d) => MOCK.quizzes[d] && MOCK.attempts[sid]?.[d]?.submitted).reverse().map((d) => {
        const a = MOCK.attempts[sid][d];
        return {
          value: d,
          label: `${UI.fmtDate(d, { compact: true })}`,
          sub: MOCK.aiNotes[d]?.title || '퀴즈',
          score: `${a.score} / 10`,
        };
      });
      const recent5 = opts.slice(0, 5).map((o) => o.value);
      const preset = (presetDates || []).filter((d) => opts.some((o) => o.value === d));

      fp.body.innerHTML = `
        <h1 style="font-size: 28px; font-weight: 700; margin: 0 0 12px; color: var(--lk-color-fg-strong); letter-spacing: -0.02em;">보충 퀴즈 출제</h1>
        <p class="text-mute" style="margin: 0 0 20px; font-size: 14px;">오답을 기반으로 추가 문제를 만들어 바로 풀 수 있어요</p>
        <div class="card" style="max-width: 640px;">
          <div class="field">
            <label>대상 날짜 <span class="text-mute" style="font-weight:400;">· 퀴즈가 있는 날짜에서 최대 5개 선택</span> <span style="float:right; font-weight:600; color:var(--lk-color-fg-primary);" data-slot="selcount"></span></label>
            <div id="date-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap:10px; margin-top:8px; max-height:320px; overflow-y:auto; padding:2px;"></div>
          </div>
          <div class="field"><label class="row" style="gap: 8px; cursor: pointer;"><input type="checkbox" id="wf" checked /> 오답 중심으로 출제</label></div>
          <div class="field"><label>문제 수</label><div id="count-sel"></div></div>
          <div class="row row-end" style="margin-top: 8px; gap: 8px;" id="actions"></div>
        </div>
      `;

      // 날짜 카드 뷰 — 퀴즈가 있는 날짜 + 퀴즈 제목, 최대 5개 선택. 기본은 최근 5일 선택됨.
      const selected = new Set(preset.length ? preset : recent5);
      const dateGrid = fp.body.querySelector('#date-grid');
      const selCount = fp.body.querySelector('[data-slot="selcount"]');
      function drawDates() {
        selCount.textContent = `${selected.size} / 5`;
        dateGrid.innerHTML = '';
        opts.forEach((o) => {
          const on = selected.has(o.value);
          const cardEl = document.createElement('button');
          cardEl.type = 'button';
          cardEl.style.cssText = `text-align:left; border:1.5px solid ${on ? 'var(--lk-color-border-primary)' : 'var(--lk-color-border-weak)'}; background:${on ? 'var(--lk-color-bg-primary-weak)' : 'var(--lk-color-bg-white)'}; border-radius:10px; padding:10px 12px; cursor:pointer; display:flex; flex-direction:column; gap:4px;`;
          cardEl.innerHTML = `
            <span style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
              <span style="font-size:13px; font-weight:700; color:var(--lk-color-fg-strong);" data-slot="d"></span>
              <i class="ri-icon ${on ? 'ri-checkbox-circle-fill' : 'ri-checkbox-blank-circle-line'}" style="color:${on ? 'var(--lk-color-fg-primary)' : 'var(--lk-color-fg-disabled)'};"></i>
            </span>
            <span style="font-size:11px; color:var(--lk-color-fg-alternative); line-height:1.4;" data-slot="sub"></span>
            <span style="font-size:10px; color:var(--lk-color-fg-assistive);" data-slot="sc"></span>
          `;
          cardEl.querySelector('[data-slot="d"]').textContent = UI.fmtDate(o.value, { compact: true });
          cardEl.querySelector('[data-slot="sub"]').textContent = o.sub;
          cardEl.querySelector('[data-slot="sc"]').textContent = `내 점수 ${o.score}`;
          cardEl.addEventListener('click', () => {
            if (selected.has(o.value)) selected.delete(o.value);
            else { if (selected.size >= 5) { UI.toast('최대 5개까지 선택할 수 있어요', 'danger'); return; } selected.add(o.value); }
            drawDates();
          });
          dateGrid.appendChild(cardEl);
        });
      }
      drawDates();

      const countSel = UI.select({ options: [{ value: 5, label: '5문제' }, { value: 10, label: '10문제' }, { value: 15, label: '15문제' }], value: 10 });
      fp.body.querySelector('#count-sel').appendChild(countSel);

      const actions = fp.body.querySelector('#actions');
      actions.appendChild(UI.button({ label: '취소', type: 'outline', color: 'neutral', onClick: () => UI.closeFullPage() }));
      actions.appendChild(UI.button({ label: '출제하고 풀기', type: 'solid', color: 'primary', icon: 'ri-play-circle-line', onClick: () => {
        const targets = [...selected];
        if (targets.length === 0) { UI.toast('대상 날짜를 1개 이상 선택해주세요', 'danger'); return; }
        // 오답 중심 출제인데 선택한 날짜에 오답이 0건이면 출제 불가 (에러 안내)
        const wrongFocus = fp.body.querySelector('#wf').checked;
        if (wrongFocus) {
          const wrongForDates = (MOCK.wrongNotes[sid] || []).filter((w) => selected.has(w.date));
          if (wrongForDates.length === 0) {
            UI.toast('선택한 날짜에 오답이 없어 보충 퀴즈를 출제할 수 없어요 — \'오답 중심\'을 끄거나 오답이 있는 날짜를 선택해주세요', 'danger');
            return;
          }
        }
        // 내부적으로 하루 한도 차감 (학생에게 횟수 비표시)
        const cur = UI.loadState();
        UI.saveState({ suppMadeExtra: (cur.suppMadeExtra || 0) + 1 });
        UI.closeFullPage();
        UI.toast('보충 퀴즈가 출제됐어요 — 바로 풀어볼까요?', 'success');
        // 생성 직후 바로 풀이 화면으로
        const today = MOCK.meta.today;
        const takeDate = [today, ...targets, ...MOCK.days].find((d) => MOCK.quizzes[d] && MOCK.quizzes[d].questions && MOCK.quizzes[d].questions.length);
        if (takeDate) openTaking(takeDate);
        else UI.toast('풀 수 있는 문항이 아직 없어요', 'danger');
      } }));
    }

    // ============================================================
    // 보충 퀴즈 디테일 (풀이 결과·해설)
    // ============================================================
    function openSuppDetail(set) {
      if (!set.solved) {
        // 미응시 — 응시 진입
        const fp = UI.openFullPage({ backLabel: '학습퀴즈' });
        fp.body.innerHTML = `
          <div style="display:flex; align-items:center; gap:10px; margin-bottom: 8px;">
            <span class="card-meta">${UI.fmtDate(set.targetDate)}</span>
            <span class="tag tag-small tag-weak-neutral">미응시</span>
          </div>
          <h1 style="font-size: 28px; font-weight: 700; margin: 0 0 8px;" data-slot="t"></h1>
          <p class="text-mute" style="font-size: 14px; margin: 0 0 24px;">총 ${set.count}문제 · 아직 풀지 않은 보충 퀴즈예요</p>
          <div id="start-btn"></div>
        `;
        fp.body.querySelector('[data-slot="t"]').textContent = `${set.topic} · 보충 ${set.count}문제`;
        fp.body.querySelector('#start-btn').appendChild(UI.button({ label: '보충 퀴즈 풀기', icon: 'ri-play-circle-line', type: 'solid', color: 'primary', size: 'large', onClick: () => { UI.closeFullPage(); openTaking(set.targetDate); } }));
        return;
      }
      const baseQuiz = MOCK.quizzes[set.targetDate] || MOCK.quizzes[MOCK.meta.today];
      const qs = (baseQuiz?.questions || []).slice(0, Math.min(set.count, baseQuiz?.questions?.length || 0));
      const wrongIds = qs.slice(set.correct).map((q) => q.id);
      const score = Math.round(set.rate * 10);
      openResult(set.targetDate, { submitted: true, score, wrongIds, submittedAt: set.createdAt }, {
        kind: 'supp',
        title: `보충 퀴즈 · ${set.topic} (${set.count}문제)`,
        backLabel: '학습퀴즈',
        questions: qs,
      });
    }

    // ============================================================
    // 응시 / 결과·해설
    // ============================================================
    function openTaking(date, ctx) {
      const quiz = MOCK.quizzes[date];
      let cur = 0;
      let selections = {};
      const totalDemo = 3;
      const fp = UI.openFullPage({ backLabel: ctx?.backLabel || '학습퀴즈' });

      function paint() {
        const q = quiz.questions[cur];
        fp.actions.innerHTML = '';
        const progress = document.createElement('div');
        progress.style.cssText = 'font-size: 13px; color: var(--lk-color-fg-strong);';
        progress.innerHTML = `<strong>${cur + 1}</strong> <span class="text-mute">/ 10</span> <span class="text-primary" style="margin-left: 8px;">${Math.round((cur + 1) / 10 * 100)}%</span>`;
        fp.actions.appendChild(progress);

        fp.body.innerHTML = `
          <div class="quiz-bar"><i style="width: ${(cur + 1) / 10 * 100}%"></i></div>
          <div class="quiz-card" style="max-width: 720px; margin: 0 auto;">
            <span class="quiz-type tag tag-small tag-solid-primary">객관식</span>
            <p class="quiz-stem" data-slot="stem"></p>
            <div id="choices"></div>
            <div class="row row-end" style="margin-top: 24px;"><span id="submit-btn"></span></div>
          </div>
        `;
        fp.body.querySelector('[data-slot="stem"]').textContent = q.stem;
        const choicesEl = fp.body.querySelector('#choices');
        q.choices.forEach((c, idx) => {
          const el = document.createElement('div');
          el.className = 'choice' + (selections[q.id] === idx ? ' is-selected' : '');
          el.innerHTML = `<span class="num">${idx + 1}</span><span class="label" data-slot="t"></span>`;
          el.querySelector('[data-slot="t"]').textContent = c;
          el.addEventListener('click', () => {
            selections[q.id] = idx;
            choicesEl.querySelectorAll('.choice').forEach((c) => c.classList.remove('is-selected'));
            el.classList.add('is-selected');
            paintSubmit();
          });
          choicesEl.appendChild(el);
        });
        paintSubmit();

        function paintSubmit() {
          const wrap = fp.body.querySelector('#submit-btn');
          wrap.innerHTML = '';
          wrap.appendChild(UI.button({
            label: cur === totalDemo - 1 ? '제출하고 채점 보기' : '제출하기',
            size: 'large',
            type: 'solid',
            color: 'primary',
            disabled: selections[q.id] == null,
            onClick: () => {
              if (cur < totalDemo - 1) { cur++; paint(); }
              else {
                const score = Math.round((Object.values(selections).filter((s, i) => s === quiz.questions[i].answer).length / totalDemo) * 10);
                const wrongIds = Object.entries(selections)
                  .filter(([qid, s]) => quiz.questions.find((q) => q.id === qid).answer !== s)
                  .map(([qid]) => qid);
                UI.closeFullPage();
                openResult(date, { submitted: true, score, wrongIds, submittedAt: new Date().toISOString() }, ctx);
                UI.toast(`채점 완료 — 오답 ${wrongIds.length}건이 오답노트에 누적되었어요`, 'success');
              }
            },
          }));
        }
      }
      paint();
    }

    function openResult(date, attempt, ctx) {
      const quiz = MOCK.quizzes[date] || { questions: ctx?.questions || [] };
      const fp = UI.openFullPage({ backLabel: ctx?.backLabel || '학습퀴즈' });

      // 발행 후 매니저가 텍스트를 수정한 경우 — "수정됨 · 시각" 배지 (응시 완료 학생도 확인)
      const editedTimes = (ctx?.questions || quiz.questions || []).map((q) => q.editedAt).filter(Boolean).sort();
      const latestEdit = editedTimes[editedTimes.length - 1] || null;

      fp.body.innerHTML = `
        <div style="display:flex; align-items:center; gap:10px; margin-bottom: 8px;">
          <span class="card-meta" data-slot="d"></span>
          ${ctx?.kind === 'supp' ? '<span class="tag tag-small tag-weak-neutral">보충 퀴즈</span>' : '<span class="tag tag-small tag-weak-enabled">학습퀴즈</span>'}
          ${latestEdit ? `<span class="tag tag-small tag-weak-warning"><i class="ri-icon ri-pencil-line"></i> 수정됨 · ${UI.relTime(latestEdit)}</span>` : ''}
        </div>
        <h1 style="font-size: 28px; font-weight: 700; margin: 0 0 24px; color: var(--lk-color-fg-strong); letter-spacing: -0.02em;" data-slot="t"></h1>
        <div class="row" style="gap: 32px; margin-bottom: 24px;">
          <div><div class="card-meta">점수</div><div style="font-size: 24px; font-weight: 700; margin-top: 4px;" data-slot="score"></div></div>
          <div><div class="card-meta">정답률</div><div style="font-size: 24px; font-weight: 700; margin-top: 4px;" data-slot="rate"></div></div>
          <div><div class="card-meta">오답 수</div><div style="font-size: 24px; font-weight: 700; margin-top: 4px;" data-slot="wc"></div></div>
          ${attempt.durationSec != null ? `<div><div class="card-meta">풀이 시간</div><div style="font-size: 24px; font-weight: 700; margin-top: 4px;" data-slot="dur"></div><div class="card-meta" style="margin-top:2px;">목표 ${fmtDur(MOCK.quizTargetSec)}</div></div>` : ''}
        </div>
        <div id="qlist" class="col" style="gap: 12px; max-width: 760px;"></div>
      `;
      fp.body.querySelector('[data-slot="d"]').textContent = UI.fmtDate(date);
      fp.body.querySelector('[data-slot="t"]').textContent = ctx?.title || MOCK.aiNotes[date]?.title || '퀴즈 결과';
      fp.body.querySelector('[data-slot="score"]').textContent = `${attempt.score} / 10`;
      fp.body.querySelector('[data-slot="rate"]').textContent = `${attempt.score * 10}%`;
      fp.body.querySelector('[data-slot="wc"]').textContent = `${(attempt.wrongIds || []).length}건`;
      if (attempt.durationSec != null) fp.body.querySelector('[data-slot="dur"]').textContent = fmtDur(attempt.durationSec);

      const wrongSet = new Set(attempt.wrongIds || []);
      const list = fp.body.querySelector('#qlist');
      const total = ctx?.questions || quiz.questions;
      // 이 응시 건의 총 풀이 시간(durationSec)을 문항 난이도(avgSec) 가중으로 분배해
      // "이 학생이 이 문항에 실제로 쓴 시간"을 산출 (평균이 아닌 본인 시간)
      const totalAvgSec = (total || []).reduce((s, q) => s + (q.avgSec || 0), 0);
      const studentSec = (q) => (attempt.durationSec != null && totalAvgSec > 0 && q.avgSec != null)
        ? Math.round(q.avgSec * attempt.durationSec / totalAvgSec) : null;
      total.forEach((q, i) => {
        const isWrong = wrongSet.has(q.id);
        const ss = studentSec(q);
        const timeTag = ss != null
          ? `<span class="tag tag-small tag-weak-neutral" title="이 학생이 이 문항에 쓴 시간"><i class="ri-icon ri-timer-line"></i> ${fmtDur(ss)}</span>`
          : (q.avgSec != null ? `<span class="tag tag-small tag-weak-neutral" title="문항 평균 응시시간 — 난이도 지표"><i class="ri-icon ri-timer-line"></i> 평균 ${fmtDur(q.avgSec)}</span>` : '');
        const card = document.createElement('div');
        card.className = 'card';
        card.style.borderColor = isWrong ? 'var(--lk-color-state-danger)' : 'var(--lk-color-border-weak)';
        card.innerHTML = `
          <div class="spread" style="margin-bottom: 12px;">
            <div class="card-meta">문항 ${i + 1} / ${total.length}</div>
            <div class="row" style="gap: 6px;">
              ${timeTag}
              ${q.editedAt ? `<span class="tag tag-small tag-weak-warning"><i class="ri-icon ri-pencil-line"></i> 수정됨 · ${UI.relTime(q.editedAt)}</span>` : ''}
              <span class="tag tag-small ${isWrong ? 'tag-weak-error' : 'tag-weak-success'}">${isWrong ? '오답' : '정답'}</span>
            </div>
          </div>
          <h4 style="font-size: 15px; font-weight: 700; margin: 0 0 14px; line-height: 1.5;" data-slot="stem"></h4>
          <ul style="list-style: none; padding: 0; margin: 0 0 14px;" data-slot="ch"></ul>
          <div style="font-size: 13px; color: var(--lk-color-fg-neutral); line-height: 1.7; background: var(--lk-color-bg-normal); padding: 12px 14px; border-radius: 8px;" data-slot="ex"></div>
        `;
        card.querySelector('[data-slot="stem"]').textContent = q.stem;
        const ul = card.querySelector('[data-slot="ch"]');
        q.choices.forEach((ch, idx) => {
          const li = document.createElement('li');
          li.style.cssText = 'padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 6px; background: var(--lk-color-bg-normal);';
          if (idx === q.answer) li.style.background = 'var(--lk-color-bg-lightgreen)';
          li.textContent = `${idx + 1}. ${ch}${idx === q.answer ? '   ✓ 정답' : ''}`;
          ul.appendChild(li);
        });
        card.querySelector('[data-slot="ex"]').innerHTML = `<strong>해설:</strong> ${q.explanation}`;
        list.appendChild(card);
      });

      // 결과 하단 후속 학습 — 학습퀴즈 결과에만 (보충 결과 제외)
      if (ctx?.kind !== 'supp') {
        const footer = document.createElement('div');
        footer.className = 'row';
        footer.style.cssText = 'gap: 10px; margin-top: 28px; max-width: 760px;';
        footer.appendChild(UI.button({ label: 'ALEX 복습하기', icon: 'ri-robot-2-line', type: 'outline', color: 'primary', size: 'large', onClick: () => {
          UI.toast('ALEX에 오늘 오답 내역을 전달했어요 — 부족한 개념을 설명하고 질의응답할 수 있어요 (캠프파이어 ALEX 연동)', 'success');
        } }));
        footer.appendChild(UI.button({ label: '보충 퀴즈 풀기', icon: 'ri-add-circle-line', type: 'solid', color: 'primary', size: 'large', onClick: () => {
          UI.closeFullPage();
          openSuppCreate(undefined, [date]);
        } }));
        fp.body.appendChild(footer);
      }
    }

    // ============================================================
    // 매니저뷰
    // ============================================================
    function renderManager() {
      const tabs = [
        { key: 'today', label: '퀴즈 발행하기' },
        { key: 'published', label: '발행된 퀴즈' },
        { key: 'supp', label: '보충 퀴즈 사용 현황' },
      ];
      const st = UI.loadState();
      const active = st.mgrQuizTab || 'today';

      const tabsEl = document.createElement('div');
      tabsEl.className = 'tabs';
      tabs.forEach((t) => {
        const btn = document.createElement('button');
        btn.className = 'tab' + (active === t.key ? ' is-active' : '');
        btn.textContent = t.label;
        btn.addEventListener('click', () => { UI.saveState({ mgrQuizTab: t.key }); location.reload(); });
        tabsEl.appendChild(btn);
      });
      root.appendChild(tabsEl);

      const body = document.createElement('section');
      body.style.marginTop = '24px';
      root.appendChild(body);

      if (active === 'today') renderMgrToday(body);
      else if (active === 'published') renderMgrPublished(body);
      else renderMgrSupp(body);
    }

    // 퀴즈 발행하기 탭 — 발행 예정 / 임시 저장 2서브탭 (Figma 11665:39011 정합 · 2026-06-09)
    // 분류 기준: scheduled(오늘 자동 08:30 + 미래 예약) = 발행 예정, draft·생성실패 = 임시 저장
    function renderMgrToday(body) {
      const today = MOCK.meta.today;
      const q = MOCK.quizzes[today];
      const limit = MOCK.todayQuizDailyLimit || 20;

      // 발행 정책 박스 — 📌 제목 + 3 bullet
      const policy = document.createElement('div');
      policy.className = 'banner banner-info banner-policy';
      policy.innerHTML = `
        <div class="banner-policy-head"><i class="ri-icon ri-pushpin-line"></i><strong>퀴즈 발행 정책</strong></div>
        <ul class="banner-policy-list">
          <li>매일 오전 <strong>08:30</strong>에 AI 퀴즈 1세트가 자동 생성 후 발행됩니다.</li>
          <li>강사·매니저는 추가 퀴즈를 만들어 <strong>예약·즉시 발행</strong>할 수 있습니다.</li>
          <li>퀴즈를 발행하면 해당 목록은 <strong>발행된 퀴즈</strong> 탭으로 이동합니다.</li>
        </ul>`;
      body.appendChild(policy);

      // 자동 생성 실패 — 학생뷰 비노출, 매니저뷰만 + 즉시 재생성 (POL §1.1)
      if (q?.status === 'generation_failed') {
        body.appendChild(UI.banner({ kind: 'error', msg: '오늘 자동 생성에 실패했어요. (학생에게는 노출되지 않아요) 바로 재생성할 수 있어요.', action: { label: '재생성', onClick: () => {
          const set = (q.sets || []).find((s) => s.source === 'auto') || (q.sets || [])[0];
          if (set) { set.questions = genQuestions(10, MOCK.aiNotes[today]?.title || '오늘 핵심 개념'); set.status = 'draft'; set.title = set.title && set.title !== '새 퀴즈' ? set.title : `${MOCK.aiNotes[today]?.title || '오늘'} 데일리 퀴즈`; }
          MOCK.quizzes[today].status = 'draft';
          UI.toast('퀴즈를 재생성했어요 — 검토 후 발행하세요', 'success');
          if (set) openDraftEditor(today, set, () => { body.innerHTML = ''; renderMgrToday(body); });
          else { body.innerHTML = ''; renderMgrToday(body); }
        } } }));
      }

      // 상단 — 제목 + solid 새 퀴즈 추가 (Figma: primary solid)
      const head = document.createElement('div');
      head.className = 'section-head';
      head.style.margin = '20px 0 16px';
      head.innerHTML = `<h3>퀴즈 발행하기</h3><span id="new-set-btn"></span>`;
      head.querySelector('#new-set-btn').appendChild(UI.button({ label: '새 퀴즈 추가', icon: 'ri-add-line', type: 'solid', color: 'primary', size: 'medium', onClick: () => {
        const dayCount = (MOCK.quizzes[today]?.sets || []).length;
        if (limit - dayCount <= 0) { UI.toast(`학습퀴즈는 하루 최대 ${limit}개까지 발행할 수 있어요`, 'danger'); return; }
        const newSet = { id: `${today}-set-manual-${Date.now()}`, title: '새 퀴즈', source: 'manual', status: 'draft', publishedAt: null, scheduledAt: `${today}T08:30`, questions: [] };
        if (!MOCK.quizzes[today]) MOCK.quizzes[today] = { sets: [] };
        if (!MOCK.quizzes[today].sets) MOCK.quizzes[today].sets = [];
        MOCK.quizzes[today].sets.push(newSet);
        openDraftEditor(today, newSet, () => { body.innerHTML = ''; renderMgrToday(body); });
      } }));
      body.appendChild(head);

      // ===== 서브탭: 발행 예정 / 임시 저장 =====
      const subDefs = [
        { key: 'scheduled', label: '발행 예정' },
        { key: 'draft', label: '임시 저장' },
      ];
      let activeSub = UI.loadState().mgrPublishSub || 'scheduled';
      const subTabs = document.createElement('div');
      subTabs.className = 'tabs';
      subTabs.style.marginBottom = '20px';
      subDefs.forEach((t) => {
        const btn = document.createElement('button');
        btn.className = 'tab' + (activeSub === t.key ? ' is-active' : '');
        btn.textContent = t.label;
        btn.dataset.sub = t.key;
        btn.addEventListener('click', () => {
          activeSub = t.key; UI.saveState({ mgrPublishSub: t.key });
          subTabs.querySelectorAll('button').forEach((x) => x.classList.toggle('is-active', x.dataset.sub === t.key));
          drawPane();
        });
        subTabs.appendChild(btn);
      });
      body.appendChild(subTabs);

      const pane = document.createElement('section');
      body.appendChild(pane);

      // 발행 예정 데모: 오늘 자동 scheduled + 미래 예약본 (발행일시순) — 페이지네이션 시연용 다건
      const addDays = (iso, n) => { const dt = new Date(iso); dt.setDate(dt.getDate() + n); return dt.toISOString().slice(0, 10); };
      const futTopics = ['SQL Window 함수 — ROW_NUMBER · LAG · LEAD', 'pandas 결측치·이상치 처리', '정규화와 인덱스 설계', 'EDA — 분포·상관·이탈 신호', 'scikit-learn 파이프라인'];
      const futCounts = [10, 15, 5, 10, 10];
      const futureScheduled = Array.from({ length: 11 }, (_, i) => {
        const day = addDays(today, Math.floor(i / 3) + 1);
        const hh = ['07:00', '12:00', '18:00'][i % 3];
        return { id: `fut-set-${i + 1}`, date: day, title: futTopics[i % futTopics.length], source: i % 3 === 0 ? 'auto' : 'manual', status: 'scheduled', scheduledAt: `${day}T${hh}`, questions: genQuestions(futCounts[i % futCounts.length], futTopics[i % futTopics.length]) };
      });

      function drawPane() {
        pane.innerHTML = '';
        const sets = (MOCK.quizzes[today]?.sets || []);
        if (activeSub === 'scheduled') {
          const scheduled = sets.filter((s) => s.status === 'scheduled').map((s) => ({ date: today, set: s }))
            .concat(futureScheduled.map((s) => ({ date: s.date, set: s })))
            .sort((a, b) => (a.set.scheduledAt || '').localeCompare(b.set.scheduledAt || ''));
          const dayCount = sets.length;
          const remaining = Math.max(0, limit - dayCount);
          const h = document.createElement('div');
          h.className = 'section-head';
          h.style.margin = '0 0 12px';
          h.innerHTML = `<h3>발행 예정 목록</h3><span class="hint">오늘 생성 퀴즈 수 · <strong style="color:var(--lk-color-fg-strong);">${dayCount}</strong> / ${limit}${remaining === 0 ? ' · 한도 도달' : ''}</span>`;
          pane.appendChild(h);
          if (scheduled.length === 0) {
            pane.appendChild(UI.emptyCard({ icon: 'ri-calendar-schedule-line', title: '발행 예정인 퀴즈가 없어요', body: '상단 [새 퀴즈 추가]로 만들어 예약·즉시 발행할 수 있어요.' }));
            return;
          }
          const list = document.createElement('div');
          list.className = 'note-list';
          pane.appendChild(list);
          const pager = document.createElement('div');
          pager.style.cssText = 'display:flex; align-items:center; justify-content:center; gap:14px; margin-top:20px;';
          pane.appendChild(pager);
          const pageSize = 10; let page = 1;
          const drawList = () => {
            const totalPages = Math.max(1, Math.ceil(scheduled.length / pageSize));
            if (page > totalPages) page = totalPages;
            const start = (page - 1) * pageSize;
            list.innerHTML = '';
            scheduled.slice(start, start + pageSize).forEach(({ date, set }) => list.appendChild(buildSlotRow(date, set, body)));
            pager.innerHTML = '';
            if (totalPages > 1) {
              pager.appendChild(UI.button({ label: '이전', icon: 'ri-arrow-left-s-line', type: 'ghost', color: 'neutral', size: 'small', disabled: page <= 1, onClick: () => { page--; drawList(); } }));
              const lbl = document.createElement('span'); lbl.className = 'hint';
              lbl.textContent = `${page} / ${totalPages} · 총 ${scheduled.length}건`;
              pager.appendChild(lbl);
              pager.appendChild(UI.button({ label: '다음', icon: 'ri-arrow-right-s-line', type: 'ghost', color: 'neutral', size: 'small', disabled: page >= totalPages, onClick: () => { page++; drawList(); } }));
            }
          };
          drawList();
        } else {
          // 임시 저장 = draft + 생성 실패 (예약·발행 전)
          const drafts = sets.filter((s) => s.status !== 'published' && s.status !== 'scheduled');
          const h = document.createElement('div');
          h.className = 'section-head';
          h.style.margin = '0 0 12px';
          h.innerHTML = `<h3>임시 저장 목록</h3><span class="hint">예약·발행 전 상태 — 클릭해 이어서 편집</span>`;
          pane.appendChild(h);
          if (drafts.length === 0) {
            pane.appendChild(UI.emptyCard({ icon: 'ri-draft-line', title: '임시 저장된 퀴즈가 없어요', body: '상단 [새 퀴즈 추가]로 만들면 여기에 임시 저장돼요.' }));
            return;
          }
          const list = document.createElement('div');
          list.className = 'note-list';
          drafts.forEach((set) => list.appendChild(buildSlotRow(today, set, body)));
          pane.appendChild(list);
        }
      }
      drawPane();
    }

    // 요약 슬롯 행 — 상태(임시저장/예약발행/생성실패)·예약 일시·이름·문항수. 클릭 시 편집/발행 폼.
    function buildSlotRow(date, set, body) {
      const row = document.createElement('div');
      row.className = 'quiz-row';
      row.style.cursor = 'pointer';
      const st = slotState(set);
      const srcTag = set.source === 'auto' ? { cls: 'tag-weak-progressing', label: '자동 생성' } : { cls: 'tag-weak-enabled', label: '강사 작성' };
      const sched = set.status === 'scheduled' && set.scheduledAt
        ? `예약 ${set.scheduledAt.slice(5, 10).replace('-', '/')} ${set.scheduledAt.slice(11, 16)}`
        : '임시저장';
      row.innerHTML = `
        <div class="quiz-date"><i class="ri-icon ${set.status === 'scheduled' ? 'ri-calendar-check-line' : 'ri-draft-line'}"></i><span data-slot="sch"></span></div>
        <div class="quiz-title" data-slot="t"></div>
        <span class="tag tag-small ${srcTag.cls}" data-slot="src"></span>
        <span class="tag tag-small tag-weak-neutral" data-slot="qc"></span>
        <span class="tag tag-small ${st.cls}" data-slot="st"></span>
        <i class="ri-icon ri-arrow-right-s-line" style="color: var(--lk-color-fg-assistive);"></i>
      `;
      row.querySelector('[data-slot="sch"]').textContent = sched;
      row.querySelector('[data-slot="t"]').textContent = set.title;
      row.querySelector('[data-slot="src"]').textContent = srcTag.label;
      row.querySelector('[data-slot="qc"]').textContent = `${set.questions.length}문항`;
      row.querySelector('[data-slot="st"]').textContent = st.label;
      row.addEventListener('click', () => openDraftEditor(date, set, () => { body.innerHTML = ''; renderMgrToday(body); }));
      return row;
    }

    function slotState(set) {
      if (set.status === 'published') return { cls: 'tag-weak-success', label: '발행됨' };
      if (set.status === 'generation_failed') return { cls: 'tag-weak-error', label: '생성 실패' };
      if (set.status === 'scheduled') return { cls: 'tag-weak-warning', label: '예약발행' };
      return { cls: 'tag-weak-neutral', label: '임시저장' };
    }

    // 데모용 AI 퀴즈/문항 생성 시뮬레이터 (정적 프로토타입 — 실제 호출 없음)
    function genQuestions(n, label) {
      return Array.from({ length: n }, (_, i) => ({
        id: `q-${Date.now()}-${i}`,
        stem: `${label} 관련 문항 ${i + 1} — 핵심 개념으로 옳은 것은?`,
        choices: ['보기 A', '보기 B', '보기 C', '보기 D'],
        answer: i % 4,
        explanation: `${label} 개념과 연결해 이해하세요. (AI 생성 해설)`,
      }));
    }

    // 편집/발행 폼 — 상단 고정 액션(AI 퀴즈 생성·임시저장·예약발행·즉시발행) + 문항 인라인 편집
    function openDraftEditor(date, set, onChange) {
      const published = set.status === 'published';
      const fp = UI.openFullPage({ backLabel: published ? '발행된 퀴즈' : '퀴즈 발행하기' });
      const reopen = () => { UI.closeFullPage(); openDraftEditor(date, set, onChange); };

      // ===== 상단 고정 액션바 =====
      if (!published) {
        fp.actions.appendChild(UI.button({ label: 'AI 퀴즈 생성', icon: 'ri-magic-line', type: 'outline', color: 'neutral', size: 'medium', onClick: () => openAiGenerate(set, false, () => renderQs()) }));
        fp.actions.appendChild(UI.button({ label: '임시저장', icon: 'ri-save-line', type: 'outline', color: 'neutral', size: 'medium', onClick: () => { set.title = titleEl.value || set.title; set.status = 'draft'; renderSchedRow(); UI.toast('임시저장됐어요 — 예약/발행 전까지 임시저장 상태예요', 'success'); if (onChange) onChange(); } }));
        fp.actions.appendChild(UI.button({ label: '예약발행', icon: 'ri-calendar-check-line', type: 'outline', color: 'primary', size: 'medium', onClick: () => { if (!validQuiz()) return; set.title = titleEl.value || set.title; openSchedulePopup(set, date, () => { renderSchedRow(); if (onChange) onChange(); }); } }));
        fp.actions.appendChild(UI.button({ label: '즉시발행', icon: 'ri-send-plane-line', type: 'solid', color: 'primary', size: 'medium', onClick: () => doPublish() }));
      } else {
        // 발행본 — 텍스트만 저장 (정답·보기 잠금). 재발행 대신 '추가 퀴즈 생성' 제공
        fp.actions.appendChild(UI.button({ label: '저장', icon: 'ri-save-line', type: 'solid', color: 'primary', size: 'medium', onClick: () => { set.title = titleEl.value || set.title; UI.toast('수정 내용을 저장했어요 (텍스트만 반영)', 'success'); if (onChange) onChange(); } }));
        fp.actions.appendChild(UI.button({ label: '추가 퀴즈 생성', icon: 'ri-add-circle-line', type: 'outline', color: 'primary', size: 'medium', onClick: () => {
          const today = MOCK.meta.today;
          const newSet = { id: `${today}-set-similar-${Date.now()}`, title: `${set.title} (유사)`, source: 'manual', status: 'draft', publishedAt: null, scheduledAt: `${today}T08:30`, questions: (set.questions || []).map((q, i) => ({ id: `q-${Date.now()}-${i}`, stem: q.stem, choices: q.choices.slice(), answer: q.answer, explanation: q.explanation })) };
          if (!MOCK.quizzes[today]) MOCK.quizzes[today] = { sets: [] };
          if (!MOCK.quizzes[today].sets) MOCK.quizzes[today].sets = [];
          MOCK.quizzes[today].sets.push(newSet);
          UI.closeFullPage();
          UI.toast('유사 퀴즈를 추가했어요 — 내용을 다듬어 발행하세요', 'success');
          openDraftEditor(today, newSet, null);
        } }));
      }

      fp.body.innerHTML = `
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
          <span class="card-meta" data-slot="d"></span>
          <span class="tag tag-small" data-slot="state"></span>
          <span class="tag tag-small ${set.source === 'auto' ? 'tag-weak-progressing' : 'tag-weak-enabled'}">${set.source === 'auto' ? '자동 생성' : '강사 작성'}</span>
        </div>
        <input type="text" id="title" style="width:100%; max-width:620px; font-size:24px; font-weight:700; border:1px solid var(--lk-color-border-normal); border-radius:10px; padding:10px 14px; letter-spacing:-0.01em;" />
        <p class="text-mute" style="font-size:12px; margin:10px 0 16px;">발행 이후에는 텍스트(문제·보기·해설)만 수정 — 정답·보기 번호 잠금</p>
        <div id="sched-row"></div>
        <div class="section-head" style="margin:24px 0 12px;"><h3>문항 (<span data-slot="qc"></span>)</h3></div>
        <div id="qlist" class="col" style="gap:14px; max-width:820px;"></div>
        <div id="add-q" style="margin-top:16px; max-width:820px;"></div>
      `;
      const titleEl = fp.body.querySelector('#title');
      titleEl.value = set.title || '';
      fp.body.querySelector('[data-slot="d"]').textContent = UI.fmtDate(date);

      function paintState() { const s = slotState(set); const el = fp.body.querySelector('[data-slot="state"]'); el.className = 'tag tag-small ' + s.cls; el.textContent = s.label; }
      const schedRow = fp.body.querySelector('#sched-row');
      function renderSchedRow() {
        paintState();
        schedRow.innerHTML = '';
        // 예약발행일시는 "예약발행"된 경우에만 표시
        if (set.status === 'scheduled' && set.scheduledAt) {
          const box = document.createElement('div'); box.className = 'banner banner-info'; box.style.maxWidth = '620px';
          box.innerHTML = `<i class="ri-icon ri-calendar-check-line"></i><span>예약 발행: <strong>${set.scheduledAt.slice(0, 10).replace(/-/g, '.')} ${set.scheduledAt.slice(11, 16)}</strong></span><div class="actions"></div>`;
          box.querySelector('.actions').appendChild(UI.button({ label: '변경', type: 'outline', color: 'primary', size: 'small', onClick: () => openSchedulePopup(set, date, () => { renderSchedRow(); if (onChange) onChange(); }) }));
          schedRow.appendChild(box);
        } else if (published && set.publishedAt) {
          const box = document.createElement('div'); box.className = 'banner banner-info'; box.style.maxWidth = '620px';
          box.innerHTML = `<i class="ri-icon ri-checkbox-circle-line"></i><span>발행 시각: <strong>${UI.relTime(set.publishedAt)}</strong></span>`;
          schedRow.appendChild(box);
        }
      }
      renderSchedRow();

      const qcEl = fp.body.querySelector('[data-slot="qc"]');
      const qlist = fp.body.querySelector('#qlist');
      function renderQs() {
        qlist.innerHTML = '';
        qcEl.textContent = String(set.questions.length);
        set.questions.forEach((qq, i) => qlist.appendChild(buildQuestionForm(set, qq, i, published, renderQs)));
        if (set.questions.length === 0) {
          const e = document.createElement('p');
          e.className = 'text-mute';
          e.style.cssText = 'font-size:13px; padding:16px; text-align:center; border:1px dashed var(--lk-color-border-normal); border-radius:10px;';
          e.textContent = '아직 문항이 없어요. 상단 [AI 퀴즈 생성] 또는 아래 [문항 추가]로 시작하세요.';
          qlist.appendChild(e);
        }
      }
      {
        const addBtn = UI.button({ label: '문항 추가', icon: 'ri-add-line', type: 'outline', color: 'primary', size: 'medium', onClick: () => { set.questions.push({ id: `q-${Date.now()}`, stem: '', choices: ['', '', '', ''], answer: 0, explanation: '' }); renderQs(); } });
        addBtn.style.width = '100%';
        fp.body.querySelector('#add-q').appendChild(addBtn);
      }
      renderQs();

      function validQuiz() {
        if (set.questions.length === 0) { UI.toast('문항을 1개 이상 추가해주세요', 'danger'); return false; }
        if (set.questions.some((qq) => !qq.stem || qq.choices.some((c) => !c) || !qq.explanation)) { UI.toast('빈 문항이 있어요 — 문제·보기·해설을 모두 채워주세요', 'danger'); return false; }
        return true;
      }
      function doPublish() {
        set.title = titleEl.value || set.title;
        if (!validQuiz()) return;
        set.status = 'published';
        set.publishedAt = new Date().toISOString();
        UI.closeFullPage();
        UI.toast(`"${set.title}" 발행됨 — 학생 알림 발송 · '발행된 퀴즈' 탭으로 이동`, 'success');
        if (onChange) onChange();
      }
    }

    // AI 퀴즈 생성 팝업 — 퀴즈 전체 문항을 새로 생성(덮어쓰기). AI 노트 기반 / 입력 기반.
    function openAiGenerate(set, published, onDone) {
      let mode = 'note';
      const noteDates = Object.keys(MOCK.aiNotes).sort().reverse();
      const node = UI.openModal(`
        <h3 class="card-title">AI 퀴즈 생성</h3>
        <div class="banner banner-error" style="margin:10px 0 14px;"><i class="ri-icon ri-error-warning-line"></i><span>현재 세트의 <strong>모든 문항을 새로 생성</strong>합니다. 이미 작성된 문항이 있으면 <strong>덮어쓰기</strong>돼요${published ? ' — 발행본은 응시 결과가 재집계됩니다' : ''}.</span></div>
        <div class="tabs-round" id="mode" style="margin-bottom:14px;">
          <button class="tab is-active" data-m="note">AI 노트 기반</button>
          <button class="tab" data-m="input">입력 기반</button>
        </div>
        <div id="pane"></div>
        <div class="field" style="max-width:200px; margin-top:12px;"><label>생성할 문항 수</label><div id="cnt"></div></div>
        <div class="row row-end" style="margin-top:16px; gap:8px;" id="acts"></div>
      `);
      const pane = node.querySelector('#pane');
      function renderPane() {
        pane.innerHTML = '';
        if (mode === 'note') {
          const wrap = document.createElement('div');
          wrap.style.cssText = 'max-height:240px; overflow-y:auto; border:1px solid var(--lk-color-border-weak); border-radius:10px; padding:10px;';
          const h = document.createElement('div'); h.className = 'card-meta'; h.style.marginBottom = '6px'; h.textContent = '기반으로 삼을 AI 노트 선택 (복수 가능)'; wrap.appendChild(h);
          noteDates.forEach((d) => {
            const lab = document.createElement('label'); lab.className = 'row'; lab.style.cssText = 'gap:8px; padding:6px 4px; cursor:pointer; align-items:center;';
            const cb = document.createElement('input'); cb.type = 'checkbox'; cb.dataset.note = d; lab.appendChild(cb);
            const sp = document.createElement('span'); sp.style.fontSize = '13px'; sp.textContent = `${UI.fmtDate(d, { short: true })} · ${MOCK.aiNotes[d].title}`; lab.appendChild(sp);
            wrap.appendChild(lab);
          });
          pane.appendChild(wrap);
        } else {
          const ta = document.createElement('textarea'); ta.id = 'concept'; ta.placeholder = '문항으로 만들 개념/주제를 입력하세요 (예: pandas merge vs join 차이)'; ta.style.minHeight = '90px'; ta.style.width = '100%';
          pane.appendChild(ta);
          // 예시 프롬프트 안내 — 클릭하면 입력란에 채워짐 (W3)
          const guide = document.createElement('div');
          guide.style.cssText = 'margin-top:10px;';
          guide.innerHTML = `<div class="card-meta" style="margin-bottom:6px;"><i class="ri-icon ri-lightbulb-line"></i> 예시 프롬프트 — 클릭하면 입력돼요</div><div id="ex-chips" style="display:flex; flex-wrap:wrap; gap:6px;"></div><p class="hint" style="margin:8px 0 0;">개념·비교·상황을 구체적으로 적을수록 문항 품질이 올라가요. (예: "~의 차이와 각각 언제 쓰는지", "~의 장단점")</p>`;
          const examples = [
            'pandas merge와 join의 차이, 각각 언제 쓰는지',
            'groupby 후 agg로 다중 집계를 수행하는 방법',
            'SQL의 INNER JOIN과 LEFT JOIN 결과 차이',
            '결측치 처리 전략(제거·평균대치·예측대치)의 장단점',
            '정규화와 표준화의 차이와 사용 상황',
          ];
          const chipWrap = guide.querySelector('#ex-chips');
          examples.forEach((ex) => {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'btn btn-small btn-ghost-neutral';
            chip.textContent = ex;
            chip.addEventListener('click', () => { ta.value = ex; ta.focus(); });
            chipWrap.appendChild(chip);
          });
          pane.appendChild(guide);
        }
      }
      node.querySelectorAll('#mode button').forEach((b) => b.addEventListener('click', () => { node.querySelectorAll('#mode button').forEach((x) => x.classList.remove('is-active')); b.classList.add('is-active'); mode = b.dataset.m; renderPane(); }));
      renderPane();
      const cntSel = UI.select({ options: [{ value: 5, label: '5문항' }, { value: 10, label: '10문항' }, { value: 15, label: '15문항' }], value: 10 });
      node.querySelector('#cnt').appendChild(cntSel);
      const acts = node.querySelector('#acts');
      acts.appendChild(UI.button({ label: '취소', type: 'outline', color: 'neutral', onClick: () => node.remove() }));
      acts.appendChild(UI.button({ label: '생성 (덮어쓰기)', icon: 'ri-magic-line', type: 'solid', color: 'primary', onClick: () => {
        const n = cntSel.value || 10;
        let label;
        if (mode === 'note') {
          const picked = Array.from(node.querySelectorAll('[data-note]:checked')).map((c) => c.dataset.note);
          if (picked.length === 0) { UI.toast('AI 노트를 1개 이상 선택해주세요', 'danger'); return; }
          label = 'AI 노트 ' + picked.map((d) => MOCK.aiNotes[d].title).slice(0, 2).join(', ') + (picked.length > 2 ? ` 외 ${picked.length - 2}건` : '');
        } else {
          const c = (node.querySelector('#concept').value || '').trim();
          if (!c) { UI.toast('개념/주제를 입력해주세요', 'danger'); return; }
          label = c;
        }
        set.questions = genQuestions(n, label);
        node.remove();
        UI.toast(`AI가 ${n}문항을 생성했어요 (${mode === 'note' ? 'AI 노트 기반' : '입력 기반'})`, 'success');
        if (onDone) onDone();
      } }));
    }

    // 예약 발행 팝업 — 일시 지정 (예약발행 시에만 일시 노출)
    function openSchedulePopup(set, date, onDone) {
      const node = UI.openModal(`
        <h3 class="card-title">예약 발행</h3>
        <p class="text-mute" style="font-size:13px; margin:8px 0 14px;">지정한 일시에 자동 발행됩니다. 발행되면 '발행된 퀴즈' 탭으로 이동해요.</p>
        <div class="field"><label>예약 발행 일시</label><input type="datetime-local" id="sd" /></div>
        <p class="hint" style="margin:-2px 0 0;">오전 퀴즈 슬롯(08:30~09:30) 권장 — 학생 알림 분산을 줄여요.</p>
        <div class="row row-end" style="margin-top:16px; gap:8px;" id="acts"></div>
      `);
      node.querySelector('#sd').value = (set.scheduledAt || `${date}T08:30`).slice(0, 16);
      const acts = node.querySelector('#acts');
      acts.appendChild(UI.button({ label: '취소', type: 'outline', color: 'neutral', onClick: () => node.remove() }));
      acts.appendChild(UI.button({ label: '예약 발행', icon: 'ri-calendar-check-line', type: 'solid', color: 'primary', onClick: () => {
        const v = node.querySelector('#sd').value;
        if (!v) { UI.toast('일시를 선택해주세요', 'danger'); return; }
        set.scheduledAt = v; set.status = 'scheduled';
        node.remove();
        UI.toast(`예약 발행 설정됨 — ${v.slice(5, 10).replace('-', '/')} ${v.slice(11, 16)}`, 'success');
        if (onDone) onDone();
      } }));
    }

    // 문항별 AI 재발행 팝업 — 입력 개념으로 객관식 1문항 생성(덮어쓰기). 발행본이면 invalidation.
    function openQuestionRegen(set, q, published, onDone) {
      const node = UI.openModal(`
        <h3 class="card-title">AI 문항 생성 (문항별)</h3>
        <p class="text-mute" style="font-size:13px; margin:8px 0 12px;">입력한 개념에 맞춰 객관식 1문항(문제·보기·정답·해설)을 새로 생성해 <strong>이 문항을 덮어써요</strong>.</p>
        ${published ? '<div class="banner banner-error" style="margin-bottom:12px;"><i class="ri-icon ri-error-warning-line"></i><span>발행본이라 이 문항의 <strong>응시 결과가 무효화·재집계</strong>되고, 학생뷰에 <strong>수정됨</strong> 배지가 노출돼요.</span></div>' : ''}
        <div class="field"><label>개념/주제</label><textarea id="concept" style="min-height:80px;" placeholder="예: groupby 후 agg 다중 집계"></textarea></div>
        <div class="row row-end" style="margin-top:14px; gap:8px;" id="acts"></div>
      `);
      const acts = node.querySelector('#acts');
      acts.appendChild(UI.button({ label: '취소', type: 'outline', color: 'neutral', onClick: () => node.remove() }));
      acts.appendChild(UI.button({ label: '재생성 (덮어쓰기)', icon: 'ri-magic-line', type: 'solid', color: 'primary', onClick: () => {
        const c = (node.querySelector('#concept').value || '').trim();
        if (!c) { UI.toast('개념/주제를 입력해주세요', 'danger'); return; }
        const g = genQuestions(1, c)[0];
        q.stem = g.stem; q.choices = g.choices; q.answer = g.answer; q.explanation = g.explanation;
        if (published) q.editedAt = new Date().toISOString();
        node.remove();
        UI.toast(`AI가 문항을 재생성했어요${published ? ' — 응시 결과 재집계' : ''}`, 'success');
        if (onDone) onDone();
      } }));
    }

    // 문항 인라인 편집 블록 (문제·번호 보기·정답·해설 즉시 수정) + AI 문항 생성(문항별)/삭제
    function buildQuestionForm(set, q, i, published, refresh) {
      const item = document.createElement('div');
      item.style.cssText = 'border:1px solid var(--lk-color-border-weak); border-radius:12px; padding:16px; background:var(--lk-color-bg-white);';
      item.innerHTML = `
        <div class="spread" style="margin-bottom:12px;">
          <div class="row" style="gap:6px;">
            <span class="tag tag-small tag-weak-enabled">문항 ${i + 1}</span>
            ${q.editedAt ? `<span class="tag tag-small tag-weak-warning"><i class="ri-icon ri-pencil-line"></i> 수정됨 · ${UI.relTime(q.editedAt)}</span>` : ''}
          </div>
          <div class="row" style="gap:4px;" id="qa"></div>
        </div>
        <div class="field"><label>문제</label><textarea data-f="stem" style="min-height:64px;"></textarea></div>
        <div class="field"><label>객관식 보기 · 4개</label><div class="col" style="gap:6px;" id="chs"></div></div>
        <div class="field" style="max-width:200px;"><label>정답${published ? ' (잠금)' : ''}</label><div id="ans"></div></div>
        <div class="field"><label>해설</label><textarea data-f="ex" style="min-height:64px;"></textarea></div>
      `;
      const stem = item.querySelector('[data-f="stem"]'); stem.value = q.stem || ''; stem.addEventListener('input', () => { q.stem = stem.value; });
      const chs = item.querySelector('#chs');
      q.choices.forEach((c, ci) => {
        const rowEl = document.createElement('div'); rowEl.className = 'row'; rowEl.style.cssText = 'gap:8px; align-items:center;';
        const num = document.createElement('span'); num.textContent = `${ci + 1}.`; num.style.cssText = 'flex:0 0 16px; font-weight:700; color:var(--lk-color-fg-alternative); font-size:13px;';
        const inp = document.createElement('input'); inp.type = 'text'; inp.value = c || ''; inp.placeholder = '보기 입력'; inp.style.flex = '1'; inp.addEventListener('input', () => { q.choices[ci] = inp.value; });
        rowEl.appendChild(num); rowEl.appendChild(inp); chs.appendChild(rowEl);
      });
      const ansSel = UI.select({ options: [{ value: 0, label: '1번' }, { value: 1, label: '2번' }, { value: 2, label: '3번' }, { value: 3, label: '4번' }], value: q.answer, onChange: (v) => { if (!published) q.answer = v; } });
      if (published) { ansSel.style.pointerEvents = 'none'; ansSel.style.opacity = '0.6'; }
      item.querySelector('#ans').appendChild(ansSel);
      const ex = item.querySelector('[data-f="ex"]'); ex.value = q.explanation || ''; ex.addEventListener('input', () => { q.explanation = ex.value; });
      const qa = item.querySelector('#qa');
      qa.appendChild(UI.button({ label: 'AI 문항 생성', icon: 'ri-magic-line', type: 'ghost', color: 'primary', size: 'small', onClick: () => openQuestionRegen(set, q, published, refresh) }));
      qa.appendChild(UI.button({ label: '삭제', icon: 'ri-delete-bin-line', type: 'ghost', color: 'neutral', size: 'small', onClick: () => { const idx = set.questions.findIndex((x) => x.id === q.id); if (idx >= 0) set.questions.splice(idx, 1); refresh(); UI.toast('문항 삭제됨', 'success'); } }));
      return item;
    }

    // 세트 카드: 제목 + 발행 예정시간 + 발행 버튼들 + 문항 디테일 펼치기
    function buildSetCard(date, set, idx) {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.marginBottom = '20px';
      const statusTag = set.status === 'published' ? { cls: 'tag-weak-success', label: '발행됨' } : set.status === 'draft' ? { cls: 'tag-weak-warning', label: 'Draft' } : { cls: 'tag-weak-error', label: '생성 실패' };
      const sourceTag = set.source === 'auto' ? { cls: 'tag-weak-progressing', label: '자동 생성' } : { cls: 'tag-weak-enabled', label: '강사 작성' };
      card.innerHTML = `
        <div class="card-head">
          <div>
            <div class="row" style="gap: 6px; margin-bottom: 6px;">
              <span class="tag tag-small ${statusTag.cls}" data-slot="st"></span>
              <span class="tag tag-small ${sourceTag.cls}" data-slot="src"></span>
              <span class="card-meta">문항 ${set.questions.length}개</span>
            </div>
            <h3 class="card-title" data-slot="t" style="cursor: text;"></h3>
            <input type="text" id="title-edit-${set.id}" data-slot="title-edit" style="display: none; width: 100%; max-width: 480px; padding: 6px 10px; border: 1px solid var(--lk-color-border-normal); border-radius: 6px; font-size: 16px; font-weight: 700; margin-top: 4px;" />
          </div>
          <div class="row" style="gap: 6px;" id="set-actions"></div>
        </div>

        <div style="background: var(--lk-color-bg-primary-weak); border-radius: 10px; padding: 14px 16px; margin: 16px 0;">
          <div class="row" style="gap: 16px;">
            <div>
              <div class="card-meta" style="color: var(--lk-color-fg-pressed);">발행 예정 시간</div>
              <div style="font-size: 16px; font-weight: 700; color: var(--lk-color-fg-pressed); margin-top: 2px;" data-slot="ptime"></div>
            </div>
            <div style="margin-left: auto;" id="ptime-actions"></div>
          </div>
        </div>

        <div class="divider"></div>
        <div class="spread" style="margin-bottom: 10px;">
          <h4 class="card-title" style="font-size: 14px;">문항 (${set.questions.length})</h4>
          <span id="add-q-btn"></span>
        </div>
        <div id="qlist" class="col" style="gap: 12px;"></div>
        <p class="text-mute" style="font-size: 12px; margin-top: 8px;">발행 이후에는 텍스트만 수정 가능 — 정답·보기 번호 잠금</p>
      `;
      card.querySelector('[data-slot="st"]').textContent = statusTag.label;
      card.querySelector('[data-slot="src"]').textContent = sourceTag.label;
      const titleEl = card.querySelector('[data-slot="t"]');
      const titleInput = card.querySelector('[data-slot="title-edit"]');
      titleEl.textContent = set.title;
      titleEl.addEventListener('click', () => { titleEl.style.display = 'none'; titleInput.style.display = ''; titleInput.value = set.title; titleInput.focus(); });
      titleInput.addEventListener('blur', () => { set.title = titleInput.value || set.title; titleEl.textContent = set.title; titleEl.style.display = ''; titleInput.style.display = 'none'; UI.toast('퀴즈 제목 저장됨', 'success'); });
      titleInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') titleInput.blur(); });

      card.querySelector('[data-slot="ptime"]').textContent = set.scheduledAt ? set.scheduledAt.slice(11, 16) + ' (오늘)' : (set.publishedAt ? UI.relTime(set.publishedAt) + ' (발행 완료)' : '미정');

      const ptActions = card.querySelector('#ptime-actions');
      ptActions.style.display = 'flex';
      ptActions.style.gap = '8px';
      ptActions.appendChild(UI.button({ label: '시간 수정', icon: 'ri-time-line', type: 'outline', color: 'neutral', size: 'small', onClick: () => openPtimeEdit(set) }));
      if (set.status !== 'published') {
        ptActions.appendChild(UI.button({ label: '즉시 발행', icon: 'ri-send-plane-line', type: 'solid', color: 'primary', size: 'small', onClick: () => { set.status = 'published'; set.publishedAt = new Date().toISOString(); UI.toast(`"${set.title}" 발행됨 — 학생 알림 발송`, 'success'); body.innerHTML = ''; renderMgrToday(body); } }));
      }

      const setActions = card.querySelector('#set-actions');
      setActions.appendChild(UI.button({ label: '세트 편집', icon: 'ri-edit-line', type: 'outline', color: 'neutral', size: 'small', onClick: () => openSetEditor({ date, set }) }));
      // 단일 재발행 — 세트 단위 (자동 생성 오류 세트 재생성·재발행 / 발행 후 정정)
      setActions.appendChild(UI.button({ label: '재발행', icon: 'ri-refresh-line', type: 'outline', color: 'primary', size: 'small', onClick: () => openRepublishConfirm({
        scope: 'set', label: set.title, onConfirm: () => {
          const now = new Date().toISOString();
          set.editedAt = now;
          (set.questions || []).forEach((qq) => { qq.editedAt = now; });
          body.innerHTML = ''; renderMgrToday(body);
          UI.toast(`"${set.title}" 세트가 재발행됐어요 — 응시 결과 재집계`, 'success');
        },
      }) }));
      if (set.source !== 'auto') {
        setActions.appendChild(UI.button({ label: '삭제', icon: 'ri-delete-bin-line', type: 'ghost', color: 'neutral', size: 'small', onClick: () => {
          if (confirm(`"${set.title}" 세트를 삭제할까요?`)) {
            const arr = MOCK.quizzes[date].sets;
            const idx = arr.findIndex((s) => s.id === set.id);
            if (idx >= 0) arr.splice(idx, 1);
            body.innerHTML = ''; renderMgrToday(body);
            UI.toast('세트 삭제됨', 'success');
          }
        } }));
      }

      card.querySelector('#add-q-btn').appendChild(UI.button({ label: '+ 문항 추가', icon: 'ri-add-line', type: 'outline', color: 'primary', size: 'small', onClick: () => openQuestionEditor({ set, question: null, onSave: () => { body.innerHTML = ''; renderMgrToday(body); } }) }));

      const qlist = card.querySelector('#qlist');
      set.questions.slice(0, 4).forEach((qq, i) => qlist.appendChild(buildQuestionEditCard(set, qq, i, body)));
      if (set.questions.length > 4) {
        const more = document.createElement('div');
        more.style.cssText = 'text-align: center; padding: 12px; font-size: 12px; color: var(--lk-color-fg-alternative);';
        more.textContent = `… 그 외 ${set.questions.length - 4}문항 (데모는 4문항만 펼침)`;
        qlist.appendChild(more);
      }
      return card;
    }

    function buildQuestionEditCard(set, q, i, body) {
      const item = document.createElement('div');
      item.style.cssText = 'border: 1px solid var(--lk-color-border-weak); border-radius: 10px; padding: 16px; background: var(--lk-color-bg-white);';
      item.innerHTML = `
        <div class="spread" style="margin-bottom: 10px;">
          <span class="tag tag-small tag-weak-enabled">문항 ${i + 1}</span>
          <div class="row" style="gap: 4px;" id="q-actions"></div>
        </div>
        <div style="font-size: 14px; font-weight: 600; line-height: 1.5; margin-bottom: 12px;" data-slot="stem"></div>
        <div class="col" style="gap: 6px; margin-bottom: 12px;" data-slot="ch"></div>
        <details>
          <summary style="cursor: pointer; font-size: 12px; font-weight: 600; color: var(--lk-color-fg-primary);">해설 보기</summary>
          <p style="font-size: 12.5px; line-height: 1.7; color: var(--lk-color-fg-neutral); margin: 10px 0 0; padding: 10px 12px; background: var(--lk-color-bg-normal); border-radius: 8px;" data-slot="ex"></p>
        </details>
      `;
      item.querySelector('[data-slot="stem"]').textContent = q.stem;
      const ch = item.querySelector('[data-slot="ch"]');
      q.choices.forEach((c, idx) => {
        const div = document.createElement('div');
        const isAns = idx === q.answer;
        div.style.cssText = `padding: 8px 12px; border-radius: 6px; font-size: 12.5px; ${isAns ? 'background: var(--lk-color-bg-lightgreen); color: var(--lk-color-light-green-700); font-weight: 600;' : 'background: var(--lk-color-bg-normal); color: var(--lk-color-fg-neutral);'}`;
        div.textContent = `${idx + 1}. ${c}${isAns ? '   ✓ 정답' : ''}`;
        ch.appendChild(div);
      });
      item.querySelector('[data-slot="ex"]').textContent = q.explanation;
      const acts = item.querySelector('#q-actions');

      acts.appendChild(UI.button({ label: '이 문항만 재발행', icon: 'ri-refresh-line', type: 'ghost', color: 'primary', size: 'small', onClick: () => openRepublishConfirm({

    // ============================================================

            ? '이 문항에 대한 <strong>기존 응시 결과가 무효화</strong>되고, 학생 점수·오답률이 재집계됩니다. 학생뷰에는 <strong>수정됨 · 시각</strong> 배지가 노출됩니다.'
            : '이 세트의 <strong>전체 응시 결과가 무효화</strong>되고 재집계됩니다. 자동 생성 오류 세트는 재생성 후 재발행됩니다.'}</span>
        </div>

        <div class="row row-end" style="margin-top: 20px; gap: 8px;" id="acts"></div>
      `);
      node.querySelector('[data-slot="ctx"]').textContent = `대상: ${label}`;

      acts.appendChild(UI.button({ label: isQ ? '문항 재발행' : '세트 재발행', icon: 'ri-refresh-line', type: 'solid', color: 'primary', onClick: () => { node.remove(); if (onConfirm) onConfirm(); } }));
