    // 발행된 퀴즈 — 세트 단위 리스트 (제목 표시)
    function renderMgrPublished(body) {
      const list = document.createElement('div');
      list.className = 'note-list';
      const dates = MOCK.days.filter((d) => MOCK.quizzes[d]?.status === 'published').sort().reverse();
      dates.forEach((d) => {
        const submitted = MOCK.students.filter((s) => MOCK.attempts[s.id]?.[d]?.submitted).length;
        const total = MOCK.students.length;
        (MOCK.quizzes[d]?.sets || []).forEach((set) => {
          if (set.status !== 'published') return;
          const row = document.createElement('div');
          row.className = 'quiz-row';
          row.innerHTML = `
            <div class="quiz-date"><i class="ri-icon ri-calendar-line"></i><span data-slot="d"></span></div>
            <div class="quiz-title" data-slot="t"></div>
            <span class="tag tag-small ${set.source === 'auto' ? 'tag-weak-progressing' : 'tag-weak-enabled'}" data-slot="src"></span>
            <span class="tag tag-small tag-weak-neutral" data-slot="qc"></span>
            <span class="tag tag-small tag-weak-success" data-slot="rt"></span>
          `;
          row.querySelector('[data-slot="d"]').textContent = UI.fmtDate(d);
          row.querySelector('[data-slot="t"]').textContent = set.title;
          row.querySelector('[data-slot="src"]').textContent = set.source === 'auto' ? '자동' : '강사 작성';
          row.querySelector('[data-slot="qc"]').textContent = `${set.questions.length}문항`;
          row.querySelector('[data-slot="rt"]').textContent = `${submitted}/${total} 응시 · 평균 ${(MOCK.students.reduce((sum, s) => sum + (MOCK.attempts[s.id]?.[d]?.score || 0), 0) / total).toFixed(1)}/10`;
          row.addEventListener('click', () => openPublishedDetail(d, set));
          list.appendChild(row);
        });
      });
      body.appendChild(list);
    }

    function openPublishedDetail(targetDate, set) {
      const fp = UI.openFullPage({ backLabel: '발행된 퀴즈' });
      if (set) {
        // 발행본은 텍스트만 수정 (정답·보기 잠금)
        fp.actions.appendChild(UI.button({ label: '퀴즈 수정', icon: 'ri-edit-line', type: 'outline', color: 'neutral', size: 'medium', onClick: () => openDraftEditor(targetDate, set, null) }));
        // 유사 퀴즈를 새로 만들어 '퀴즈 발행하기'에 추가
        fp.actions.appendChild(UI.button({ label: '추가 퀴즈 생성', icon: 'ri-add-circle-line', type: 'solid', color: 'primary', size: 'medium', onClick: () => {
          const today = MOCK.meta.today;
          const newSet = { id: `${today}-set-similar-${Date.now()}`, title: `${set.title} (유사)`, source: 'manual', status: 'draft', publishedAt: null, scheduledAt: `${today}T08:30`, questions: (set.questions || []).map((q, i) => ({ id: `q-${Date.now()}-${i}`, stem: q.stem, choices: q.choices.slice(), answer: q.answer, explanation: q.explanation })) };
          if (!MOCK.quizzes[today]) MOCK.quizzes[today] = { sets: [] };
          if (!MOCK.quizzes[today].sets) MOCK.quizzes[today].sets = [];
          MOCK.quizzes[today].sets.push(newSet);
          UI.closeFullPage();
          UI.toast('유사 퀴즈를 추가했어요 — 내용을 다듬어 발행하세요', 'success');
          openDraftEditor(today, newSet, null);
        } }));
      }
      const submitted = MOCK.students.filter((s) => MOCK.attempts[s.id]?.[targetDate]?.submitted).length;
      const total = MOCK.students.length;
      const avg = MOCK.students.reduce((sum, s) => sum + (MOCK.attempts[s.id]?.[targetDate]?.score || 0), 0) / total;
      const missing = total - submitted;

      // 탭: 결과 요약 / 학생별 점수 / 미응시 명단
      fp.body.innerHTML = `
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
          <span class="card-meta" data-slot="d"></span>
          <span class="tag tag-small tag-weak-success">발행됨</span>
          <span class="tag tag-small ${set?.source === 'auto' ? 'tag-weak-progressing' : 'tag-weak-enabled'}" data-slot="src"></span>
        </div>
        <h1 style="font-size: 26px; font-weight: 700; margin: 0 0 20px; color: var(--lk-color-fg-strong); letter-spacing: -0.02em;" data-slot="t"></h1>

        <div class="tabs" style="margin-bottom: 24px;">
          <button class="tab is-active" data-pt="summary"><i class="ri-icon ri-bar-chart-box-line"></i> 퀴즈 결과 요약</button>
          <button class="tab" data-pt="scores"><i class="ri-icon ri-user-star-line"></i> 학생별 점수 (${submitted})</button>
          <button class="tab" data-pt="missing"><i class="ri-icon ri-user-unfollow-line"></i> 미응시 명단 (${missing})</button>
        </div>
        <div id="pd-pane"></div>
      `;
      fp.body.querySelector('[data-slot="d"]').textContent = UI.fmtDate(targetDate);
      fp.body.querySelector('[data-slot="t"]').textContent = set?.title || MOCK.aiNotes[targetDate]?.title || '퀴즈';
      fp.body.querySelector('[data-slot="src"]').textContent = set?.source === 'auto' ? '자동 생성' : '강사 작성';

      const pane = fp.body.querySelector('#pd-pane');
      function renderPdPane(k) {
        pane.innerHTML = '';
        if (k === 'scores') renderScoresPane(pane);
        else if (k === 'missing') renderMissingPane(pane);
        else renderSummaryPane(pane);
      }
      fp.body.querySelectorAll('[data-pt]').forEach((b) => b.addEventListener('click', () => {
        fp.body.querySelectorAll('[data-pt]').forEach((x) => x.classList.remove('is-active'));
        b.classList.add('is-active');
        renderPdPane(b.dataset.pt);
      }));
      renderPdPane('summary');

      // ----- 탭1: 퀴즈 결과 요약 (KPI + 문항별 오답률 분포) -----
      function renderSummaryPane(pane) {
        // 학생별 풀이 시간 집계 — 평균 응시시간(목표 15분 대비)
        const durs = MOCK.students
          .map((s) => MOCK.attempts[s.id]?.[targetDate])
          .filter((a) => a?.submitted && a.durationSec != null)
          .map((a) => a.durationSec);
        const avgDur = durs.length ? Math.round(durs.reduce((a, b) => a + b, 0) / durs.length) : null;

        const kpi = document.createElement('div');
        kpi.className = 'kpi-grid';
        pane.appendChild(kpi);
        [
          { label: '응시율', value: `${Math.round(submitted / total * 100)}%`, sub: `${submitted}/${total}명` },
          { label: '평균 점수', value: `${avg.toFixed(1)} / 10`, sub: UI.fmtDate(targetDate, { short: true }) },
          { label: '정답률', value: `${Math.round(avg * 10)}%`, sub: '전체 평균' },
          { label: '평균 응시시간', value: avgDur != null ? fmtDur(avgDur) : '-', sub: `목표 ${fmtDur(MOCK.quizTargetSec)}` },
        ].forEach((s) => {
          const c = document.createElement('div');
          c.className = 'kpi';
          c.innerHTML = `<div class="label" data-slot="l"></div><div class="value" data-slot="v"></div><div class="sub" data-slot="sub"></div>`;
          c.querySelector('[data-slot="l"]').textContent = s.label;
          c.querySelector('[data-slot="v"]').textContent = s.value;
          c.querySelector('[data-slot="sub"]').textContent = s.sub;
          kpi.appendChild(c);
        });

        const sh = document.createElement('div');
        sh.className = 'section-head';
        sh.style.marginTop = '24px';
        sh.innerHTML = '<h3>문항별 오답률 · 평균 응시시간 · 보기 선택 분포</h3><span class="hint">오답률·응시시간이 높은 문항 = 난이도 ↑ · 09:30 리뷰 우선순위</span>';
        pane.appendChild(sh);
        const wcard = document.createElement('div');
        wcard.className = 'card';
        wcard.style.marginTop = '12px';
        const wlist = document.createElement('div');
        wlist.className = 'col';
        wlist.style.gap = '12px';
        wcard.appendChild(wlist);
        pane.appendChild(wcard);

        const qs = set?.questions || MOCK.quizzes[targetDate]?.questions || [];
        qs.slice(0, 5).forEach((q, i) => {
          const dist = [0, 0, 0, 0];
          MOCK.students.forEach((s) => {
            const a = MOCK.attempts[s.id]?.[targetDate];
            if (!a?.submitted) return;
            const correct = !a.wrongIds?.includes(q.id);
            dist[correct ? q.answer : (q.answer + 1 + (s.no + i) % 3) % 4]++;
          });
          const totalSubs = dist.reduce((a, b) => a + b, 0);
          const wrongRate = totalSubs ? Math.round((totalSubs - dist[q.answer]) / totalSubs * 100) : 0;

          const item = document.createElement('div');
          item.style.cssText = 'border: 1px solid var(--lk-color-border-weak); border-radius: 10px; padding: 14px 16px;';
          const diff = diffByTime(q.avgSec || 0);
          item.innerHTML = `
            <div class="spread" style="margin-bottom: 10px;">
              <div class="card-meta">문항 ${i + 1}</div>
              <div class="row" style="gap:6px;">
                ${q.avgSec != null ? `<span class="tag tag-small ${diff.cls}" title="평균 응시시간 기준 난이도"><i class="ri-icon ri-timer-line"></i> 평균 ${fmtDur(q.avgSec)} · ${diff.label}</span>` : ''}
                <span class="tag tag-small ${wrongRate >= 50 ? 'tag-weak-error' : wrongRate >= 30 ? 'tag-weak-warning' : 'tag-weak-success'}">오답률 ${wrongRate}%</span>
              </div>
            </div>
            <div style="font-size: 13.5px; font-weight: 600; margin-bottom: 12px; line-height: 1.5;" data-slot="stem"></div>
            <div class="col" style="gap: 6px;" data-slot="dist"></div>
          `;
          item.querySelector('[data-slot="stem"]').textContent = q.stem;
          const distEl = item.querySelector('[data-slot="dist"]');
          q.choices.forEach((c, idx) => {
            const pct = totalSubs ? Math.round(dist[idx] / totalSubs * 100) : 0;
            const row = document.createElement('div');
            row.style.cssText = 'display: grid; grid-template-columns: 24px 1fr 80px 100px; gap: 10px; align-items: center; font-size: 12px;';
            row.innerHTML = `
              <span class="text-mute">${idx + 1}.</span>
              <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" data-slot="c"></span>
              <div style="height: 8px; background: var(--lk-color-bg-normal); border-radius: 4px; overflow: hidden;">
                <div style="height: 100%; width: ${pct}%; background: ${idx === q.answer ? 'var(--lk-color-light-green-500)' : 'var(--lk-color-primary-300)'};"></div>
              </div>
              <span class="text-mute" style="text-align: right;">${dist[idx]}명 (${pct}%)${idx === q.answer ? ' ✓' : ''}</span>
            `;
            row.querySelector('[data-slot="c"]').textContent = c;
            distEl.appendChild(row);
          });
          wlist.appendChild(item);
        });
      }

      // ----- 탭2: 학생별 점수 (점수순 + 클릭 시 개별 결과 드릴다운) -----
      function renderScoresPane(pane) {
        const card = document.createElement('div');
        card.className = 'card';
        const scoreList = document.createElement('div');
        scoreList.className = 'col';
        scoreList.style.gap = '6px';
        card.appendChild(scoreList);
        pane.appendChild(card);

        const submittedStudents = MOCK.students
          .map((s) => ({ s, a: MOCK.attempts[s.id]?.[targetDate] }))
          .filter((x) => x.a?.submitted)
          .sort((a, b) => ((UI.isDropped(a.s) ? 1 : 0) - (UI.isDropped(b.s) ? 1 : 0)) || ((b.a.score || 0) - (a.a.score || 0)));
        if (submittedStudents.length === 0) {
          scoreList.appendChild(UI.emptyCard({ icon: 'ri-user-line', title: '아직 응시한 학생이 없어요', body: '응시가 시작되면 점수가 표시됩니다.' }));
          return;
        }
        submittedStudents.forEach(({ s, a }, idx) => {
          const score = a.score || 0;
          const row = document.createElement('div');
          row.className = 'quiz-row';
          row.style.cursor = 'pointer';
          if (UI.isDropped(s)) row.style.opacity = '0.6';
          const scoreCls = score >= 8 ? 'tag-weak-success' : score >= 5 ? 'tag-weak-warning' : 'tag-weak-error';
          row.innerHTML = `
            <div class="quiz-date"><span style="min-width:28px; text-align:center; font-weight:700; color:var(--lk-color-fg-neutral);" data-slot="rank"></span></div>
            <div class="quiz-title" data-slot="name"></div>
            ${UI.dropoutTag(s)}
            <span class="tag tag-small tag-weak-neutral" data-slot="dur" title="이 학생 풀이 시간"></span>
            <span class="tag tag-small tag-weak-neutral" data-slot="rate"></span>
            <span class="tag tag-small ${scoreCls}" data-slot="score"></span>
            <i class="ri-icon ri-arrow-right-s-line" style="color: var(--lk-color-fg-assistive);"></i>
          `;
          row.querySelector('[data-slot="rank"]').textContent = `${idx + 1}`;
          row.querySelector('[data-slot="name"]').textContent = UI.displayName(s);
          row.querySelector('[data-slot="dur"]').textContent = `⏱ ${fmtDur(a.durationSec)}`;
          row.querySelector('[data-slot="rate"]').textContent = `정답률 ${score * 10}%`;
          row.querySelector('[data-slot="score"]').textContent = `${score} / 10`;
          row.addEventListener('click', () => openResult(targetDate, a, { title: `${UI.displayName(s)} · 결과`, backLabel: '발행된 퀴즈', questions: set?.questions }));
          scoreList.appendChild(row);
        });
      }

      // ----- 탭3: 미응시 명단 -----
      function renderMissingPane(pane) {
        const card = document.createElement('div');
        card.className = 'card';
        const missList = document.createElement('div');
        missList.className = 'col';
        missList.style.gap = '6px';
        card.appendChild(missList);
        pane.appendChild(card);

        const missStudents = UI.sortDropoutLast(MOCK.students.filter((s) => !MOCK.attempts[s.id]?.[targetDate]?.submitted));
        if (missStudents.length === 0) {
          missList.appendChild(UI.emptyCard({ icon: 'ri-check-double-line', title: '전원 응시했어요 🎉', body: '미응시자가 없습니다.' }));
          return;
        }
        missStudents.forEach((s) => {
          const row = document.createElement('div');
          row.className = 'quiz-row';
          if (UI.isDropped(s)) row.style.opacity = '0.6';
          row.innerHTML = `
            <div class="quiz-date"><i class="ri-icon ri-user-line"></i><span data-slot="no"></span></div>
            <div class="quiz-title" data-slot="name"></div>
            ${UI.dropoutTag(s)}
            <span class="tag tag-small tag-weak-warning">미응시</span>
          `;
          row.querySelector('[data-slot="no"]').textContent = `${s.no}번`;
          row.querySelector('[data-slot="name"]').textContent = UI.displayName(s);
          missList.appendChild(row);
        });
      }
    }

    function renderMgrSupp(body) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-head">
          <div>
            <h3 class="card-title">보충 퀴즈 사용 현황</h3>
            <p class="text-mute" style="font-size: 12px; margin-top: 4px;">집계 기준 <strong>학생이 보충 퀴즈를 푼 날짜</strong> · 하루 최대 <strong>10회</strong>(=가장 붉음) · 셀 클릭 시 그날 푼 세트 리스트</p>
          </div>
          <div id="supp-legend"></div>
        </div>
        <div class="heatmap-scroll" id="heat" style="margin-top: 16px;"></div>
        <div id="supp-pager" style="display:flex; align-items:center; justify-content:center; gap:16px; margin-top:16px;"></div>
      `;
      card.querySelector('#supp-legend').appendChild(UI.renderLegend([
        { color: 'var(--lk-color-bg-normal)', label: '0회' },
        { color: 'var(--lk-color-primary-100)', label: '1–2' },
        { color: 'var(--lk-color-primary-200)', label: '3–5' },
        { color: 'var(--lk-color-primary-400)', label: '6–8' },
        { color: 'var(--lk-color-primary-500)', label: '9–10회 (Max)' },
      ]));
      body.appendChild(card);

      // 월별 페이지네이션
      const months = [...new Set(MOCK.days.map((d) => d.slice(0, 7)))].sort();
      let mi = months.length - 1; // 최신 월부터
      const heatBox = card.querySelector('#heat');
      const pager = card.querySelector('#supp-pager');
      function draw() {
        const ym = months[mi];
        const cols = MOCK.days.filter((d) => d.slice(0, 7) === ym);
        heatBox.innerHTML = '';
        heatBox.appendChild(UI.renderHeatmap({
          rows: UI.sortDropoutLast(MOCK.students),
          cols,
          rowLabel: (s) => UI.displayName(s),
          rowMuted: (s) => UI.isDropped(s),
          colLabel: (c) => `${new Date(c).getDate()}`,
          cellLevel: (s, d) => {
            const n = Math.min(10, MOCK.suppSolvedDaily[s.id]?.[d]?.plays || 0);
            if (n === 0) return { level: 0 };
            const lvl = n >= 9 ? 4 : n >= 6 ? 3 : n >= 3 ? 2 : 1;
            return { level: lvl, title: `${UI.displayName(s)} ${d}: ${n}회 풀이` };
          },
          onCell: (s, d) => openMgrSuppDetail(s, d),
        }));
        pager.innerHTML = '';
        pager.appendChild(UI.button({ label: '이전 달', icon: 'ri-arrow-left-s-line', type: 'ghost', color: 'neutral', size: 'small', disabled: mi <= 0, onClick: () => { mi--; draw(); } }));
        const lbl = document.createElement('span');
        lbl.style.cssText = 'font-size:14px; font-weight:700; color:var(--lk-color-fg-strong); min-width:120px; text-align:center;';
        lbl.textContent = `${ym.slice(0, 4)}년 ${Number(ym.slice(5, 7))}월`;
        pager.appendChild(lbl);
        pager.appendChild(UI.button({ label: '다음 달', icon: 'ri-arrow-right-s-line', type: 'ghost', color: 'neutral', size: 'small', disabled: mi >= months.length - 1, onClick: () => { mi++; draw(); } }));
      }
      draw();
    }

    // 매니저 보충 퀴즈 셀 클릭: 학생의 보충 퀴즈 풀이 리스트
    function openMgrSuppDetail(student, date) {
      const fp = UI.openFullPage({ backLabel: '보충 사용 현황' });
      // 해당 날짜에 학생이 "푼" 보충 세트 목록 (집계 기준 = 푼 날짜)
      const sets = (MOCK.suppSessions[student.id] || []).filter((set) => set.solved && set.solvedAt?.slice(0, 10) === date);

      fp.body.innerHTML = `
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
          <span class="card-meta" data-slot="d"></span>
          <span class="tag tag-small tag-weak-enabled" data-slot="cnt"></span>
        </div>
        <h1 style="font-size: 26px; font-weight: 700; margin: 0 0 20px;" data-slot="n"></h1>

        <div class="kpi-grid" id="kpi"></div>

        <div class="section-head" style="margin-top: 24px;">
          <h3>풀이 리스트</h3>
          <span class="hint">세트별 풀이 상태 · 클릭 시 결과·해설 확인</span>
        </div>
        <div id="list" class="note-list"></div>
      `;
      fp.body.querySelector('[data-slot="d"]').textContent = UI.fmtDate(date);
      fp.body.querySelector('[data-slot="cnt"]').textContent = `${sets.length}회 풀이`;
      fp.body.querySelector('[data-slot="n"]').textContent = `${UI.displayName(student)} · 이 날 푼 보충 퀴즈`;

      // KPI
      const total = sets.reduce((sum, s) => sum + s.count, 0);
      const avgRate = sets.length ? sets.reduce((sum, s) => sum + (s.rate || 0), 0) / sets.length : 0;
      const kpi = fp.body.querySelector('#kpi');
      [
        { label: '푼 횟수', value: `${sets.length}회`, sub: `Max ${MOCK.suppDailySetLimit}회` },
        { label: '총 문제 수', value: `${total}`, sub: '푼 세트 합계' },
        { label: '평균 정답률', value: `${Math.round(avgRate * 100)}%`, sub: '이 날 푼 세트 기준' },
        { label: '학습 강도', value: sets.length >= 8 ? '높음' : sets.length >= 4 ? '보통' : sets.length >= 1 ? '낮음' : '없음', sub: '푼 횟수 기준' },
      ].forEach((s) => {
        const c = document.createElement('div');
        c.className = 'kpi';
        c.innerHTML = `<div class="label" data-slot="l"></div><div class="value" data-slot="v" style="font-size: 18px;"></div><div class="sub" data-slot="sub"></div>`;
        c.querySelector('[data-slot="l"]').textContent = s.label;
        c.querySelector('[data-slot="v"]').textContent = s.value;
        c.querySelector('[data-slot="sub"]').textContent = s.sub;
        kpi.appendChild(c);
      });

      const list = fp.body.querySelector('#list');
      if (sets.length === 0) {
        list.appendChild(UI.emptyCard({ icon: 'ri-inbox-line', title: '이 날 푼 보충 퀴즈가 없어요' }));
        return;
      }
      sets.forEach((set) => {
        const row = document.createElement('div');
        row.className = 'quiz-row';
        const statusTag = { cls: 'tag-weak-success', label: `정답률 ${Math.round(set.rate * 100)}%` };
        row.innerHTML = `
          <div class="quiz-date"><i class="ri-icon ri-calendar-line"></i><span data-slot="d"></span></div>
          <div class="quiz-title" data-slot="t"></div>
          <span class="tag tag-small tag-weak-neutral" data-slot="cnt"></span>
          <span class="tag tag-small ${statusTag.cls}" data-slot="st"></span>
        `;
        row.querySelector('[data-slot="d"]').textContent = UI.relTime(set.solvedAt);
        row.querySelector('[data-slot="t"]').textContent = `${set.topic} (대상: ${UI.fmtDate(set.targetDate, { short: true })})`;
        row.querySelector('[data-slot="cnt"]').textContent = `${set.count}문제`;
        row.querySelector('[data-slot="st"]').textContent = statusTag.label;
        row.addEventListener('click', () => {
          if (!set.solved) { UI.toast('아직 풀지 않은 세트예요', 'danger'); return; }
          const baseQuiz = MOCK.quizzes[set.targetDate] || MOCK.quizzes[MOCK.meta.today];
          const qs = (baseQuiz?.questions || []).slice(0, Math.min(set.count, baseQuiz?.questions?.length || 0));
          const wrongIds = qs.slice(set.correct).map((q) => q.id);
          const score = Math.round(set.rate * 10);
          openResult(set.targetDate, { submitted: true, score, wrongIds, submittedAt: set.createdAt }, {
            kind: 'supp',
            title: `${set.topic} · ${set.count}문제 (${UI.displayName(student)})`,
            backLabel: '학생 보충 풀이',
            questions: qs,
          });
        });
        list.appendChild(row);
      });
    }

    function openManualQuizForm() {
      const fp = UI.openFullPage({ backLabel: '학습퀴즈' });
      fp.body.innerHTML = `
        <h1 style="font-size: 28px; font-weight: 700; margin: 0 0 12px; color: var(--lk-color-fg-strong); letter-spacing: -0.02em;">새 퀴즈 작성</h1>
        <p class="text-mute" style="margin: 0 0 24px;">강사가 직접 객관식 문제를 작성합니다 · 자동 생성 외 추가로 발행 가능</p>
        <div class="card" style="max-width: 720px;">
          <div class="field"><label>문제<span class="req">*</span></label><textarea id="stem" style="min-height: 100px;" placeholder="문제 본문을 입력하세요"></textarea></div>
          <div class="field"><label>객관식 보기<span class="req">*</span></label>
            <div class="col" style="gap: 8px;">
              <input type="text" placeholder="1. 보기 A" />
              <input type="text" placeholder="2. 보기 B" />
              <input type="text" placeholder="3. 보기 C" />
              <input type="text" placeholder="4. 보기 D" />
            </div>
          </div>
          <div class="field-row">
            <div class="field"><label>정답<span class="req">*</span></label><div id="ans-sel"></div></div>
            <div class="field"><label>난이도</label><div id="diff-sel"></div></div>
          </div>
          <div class="field"><label>해설<span class="req">*</span></label><textarea style="min-height: 100px;" placeholder="해설을 입력하세요"></textarea></div>
          <div class="row row-end" style="gap: 8px;" id="actions"></div>
        </div>
      `;
      fp.body.querySelector('#ans-sel').appendChild(UI.select({ options: [{ value: 1, label: '1번' }, { value: 2, label: '2번' }, { value: 3, label: '3번' }, { value: 4, label: '4번' }], value: 1 }));
      fp.body.querySelector('#diff-sel').appendChild(UI.select({ options: [{ value: 'basic', label: '기본' }, { value: 'advanced', label: '심화' }], value: 'basic' }));
      fp.body.querySelector('#actions').appendChild(UI.button({ label: '취소', type: 'outline', color: 'neutral', onClick: () => UI.closeFullPage() }));
      fp.body.querySelector('#actions').appendChild(UI.button({ label: '저장', type: 'solid', color: 'primary', onClick: () => { UI.closeFullPage(); UI.toast('새 문항이 저장되었어요', 'success'); } }));
    }
  </script>
</body>
</html>
