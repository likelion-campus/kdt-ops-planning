<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>프로젝트 — 프로토타입 v2.4</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" />
  <link rel="stylesheet" href="./assets/tokens.css" />
  <link rel="stylesheet" href="./assets/styles.css" />
  <script src="./assets/mock-data.js"></script>
  <script src="./assets/components.js"></script>
</head>
<body>
  <script>
    const { root, view } = UI.renderShell('project');
    const _isMgr = view === 'manager';
    UI.renderPageHead(root, {
      title: '프로젝트',
      subtitle: _isMgr ? '회차 등록 · 제출 모니터링 · 피드백 작성' : '기초·심화·파이널·기타 · 회차당 1건 · 마감 전까지 수정 가능',
      actions: _isMgr ? [UI.button({ label: '프로젝트 등록하기', icon: 'ri-add-line', type: 'solid', color: 'primary', onClick: openManagerCreate })] : [],
    });

    // W13 — 프로젝트는 작성·관리 중심이라 PC 전용. 모바일은 안내만.
    if (UI.pcOnlyNotice(root, '프로젝트')) { /* 모바일: 본 렌더 생략 */ }
    else if (view === 'trainee') renderTrainee(); else renderManager();

    // ============================================================
    // 헬퍼: 단계·종류 태그
    // ============================================================
    // 전체 단계(시스템) — 날짜 기반 4단계 (POL-CR-03 §6.0)
    function stageTag(p) {
      const today = new Date(MOCK.meta.today);
      const sf = new Date(p.submitFrom), st = new Date(p.submitTo), ft = new Date(p.feedbackTo);
      if (today < sf) return { key: 'scheduled', label: '예정', cls: 'tag-weak-neutral' };
      if (today <= st) return { key: 'submitting', label: '제출 마감', cls: 'tag-weak-progressing' };
      if (today <= ft) return { key: 'feedback', label: '피드백 진행중', cls: 'tag-weak-warning' };
      return { key: 'closed', label: '종료', cls: 'tag-weak-neutral' };
    }
    function dDay(dateStr) {
      const diff = Math.round((new Date(dateStr) - new Date(MOCK.meta.today)) / 86400000);
      if (diff > 0) return `D-${diff}`;
      if (diff === 0) return 'D-DAY';
      return null;
    }
    function stageWithDday(p, stage) {
      const dd = stage.key === 'submitting' ? dDay(p.submitTo) : (stage.key === 'scheduled' ? dDay(p.submitFrom) : null);
      return stage.label + (dd ? ` ${dd}` : '');
    }
    // 내 진행 상태(학생 본인) — 제출축+피드백축 결합 (POL-CR-03 §6.0)
    function myStateTag(p, mine, stage) {
      // 제출축만 (피드백 여부는 feedbackBadge로 분리 표시)
      if (mine && mine.draft) return { key: 'draft', label: '임시저장', cls: 'tag-weak-neutral' };
      if (mine) return { key: 'submitted', label: '제출 완료', cls: 'tag-weak-success' };
      if (stage.key === 'scheduled') return { key: 'not_open', label: '오픈 예정', cls: 'tag-weak-neutral' };
      if (stage.key === 'submitting') return { key: 'not_submitted', label: '미제출', cls: 'tag-weak-warning' };
      return { key: 'missed', label: '미제출 마감', cls: 'tag-weak-neutral' };
    }
    // 제출 버튼 상태 — 기간 외엔 비활성
    function submitBtnInfo(p, mine, stage) {
      if (stage.key === 'submitting') return { label: mine ? '수정하기' : '제출하기', icon: 'ri-upload-cloud-line', disabled: false };
      if (stage.key === 'scheduled') return { label: '제출 오픈 예정', icon: 'ri-time-line', disabled: true };
      return mine ? { label: '제출 완료 · 수정 마감', icon: 'ri-check-line', disabled: true } : { label: '제출 기간 종료', icon: 'ri-lock-line', disabled: true };
    }
    function roundTag(p) {
      // 종류 4개: 기초·심화·파이널·기타
      const map = {
        '기초': 'tag-weak-progressing',
        '심화': 'tag-weak-warning',
        '파이널': 'tag-weak-enabled',
        '기타': 'tag-weak-neutral',
      };
      return { cls: map[p.round] || 'tag-weak-neutral', label: p.round };
    }
    function isInFeedbackPeriod(p) {
      const today = new Date(MOCK.meta.today);
      const ff = new Date(p.feedbackFrom);
      const ft = new Date(p.feedbackTo);
      return today >= ff && today <= ft;
    }
    // 피드백 도착 표시 — 제출 상태 태그와 분리된 별도 아이콘(메시지 아이콘)
    function feedbackBadge(mine) {
      if (mine && mine.feedback) return '<span class="tag tag-small tag-weak-progressing" title="피드백 도착"><i class="ri-icon ri-chat-3-fill"></i> 피드백</span>';
      return '';
    }
    // 외부 공개 상태 태그 (제한 > 공개중 > 비공개). opts.always=true면 비공개도 태그로 표시(매니저뷰용)
    function shareStatusTag(s, opts = {}) {
      if (s.externalRestricted) return '<span class="tag tag-small tag-weak-error"><i class="ri-icon ri-lock-line"></i> 외부 공개 제한</span>';
      if (s.published) return '<span class="tag tag-small tag-weak-success"><i class="ri-icon ri-global-line"></i> 외부 공개</span>';
      if (opts.always) return '<span class="tag tag-small tag-weak-neutral"><i class="ri-icon ri-lock-2-line"></i> 외부 비공개</span>';
      return '';
    }
    // 간이 마크다운 에디터 — 툴바 + 입력 + 실시간 미리보기. {el, getValue} 반환
    // 마크다운 에디터는 공통 `UI.markdownEditor`(뷰어+편집 단일) 사용

    // ============================================================
    // 학생뷰
    // ============================================================
    function renderTrainee() {
      const sid = MOCK.activeStudentId;
      if (UI.stateFlag === 'empty') {
        root.appendChild(UI.emptyCard({ icon: 'ri-folder-line', title: '아직 등록된 프로젝트가 없어요', body: '매니저가 회차를 등록하면 카드가 표시됩니다.' }));
        return;
      }
      const list = document.createElement('div');
      list.className = 'project-wide-list';
      MOCK.projects.forEach((p) => {
        const stage = stageTag(p);
        const round = roundTag(p);
        const mine = (MOCK.projectSubmissions[p.id] || []).find((s) => s.studentId === sid);
        const my = myStateTag(p, mine, stage);
        const card = document.createElement('div');
        card.className = 'project-wide-card';
        card.innerHTML = `
          <div class="title-row">
            <span class="tag tag-small ${round.cls}" data-slot="round"></span>
            <span class="tag tag-small ${stage.cls}" data-slot="stage"></span>
            <span class="title" data-slot="title"></span>
            <span class="tag ${my.cls}" data-slot="my" style="margin-left:auto;"></span>
            <span data-slot="fbicon"></span>
          </div>
          <div class="meta-row">
            <div class="meta-pill"><span class="label">제출 기간</span><span data-slot="sf"></span> ~ <span data-slot="st"></span></div>
            <div class="meta-pill"><span class="label">피드백 기간</span><span data-slot="ff"></span> ~ <span data-slot="ft"></span></div>
          </div>
        `;
        card.querySelector('[data-slot="round"]').textContent = round.label;
        card.querySelector('[data-slot="stage"]').textContent = stageWithDday(p, stage);
        card.querySelector('[data-slot="my"]').textContent = my.label;
        card.querySelector('[data-slot="fbicon"]').innerHTML = feedbackBadge(mine);
        card.querySelector('[data-slot="title"]').textContent = p.title;
        card.querySelector('[data-slot="sf"]').textContent = UI.fmtDate(p.submitFrom, { compact: true });
        card.querySelector('[data-slot="st"]').textContent = UI.fmtDate(p.submitTo, { compact: true });
        card.querySelector('[data-slot="ff"]').textContent = UI.fmtDate(p.feedbackFrom, { compact: true });
        card.querySelector('[data-slot="ft"]').textContent = UI.fmtDate(p.feedbackTo, { compact: true });
        card.addEventListener('click', () => openTraineeDetail(p, sid));
        list.appendChild(card);
      });
      root.appendChild(list);
    }

    // ===========================================================
    // 학생 상세 — fullpage + 4탭
    // 워딩(직관적, AI스럽지 않게): 문제 / 내 제출 / 수업 제출본 / 받은 피드백
    // ===========================================================
    function openTraineeDetail(p, sid) {
      const subs = (MOCK.projectSubmissions[p.id] || []).slice();
      // 본인 맨 앞으로
      const meIdx = subs.findIndex((s) => s.studentId === sid);
      let mine = null;
      if (meIdx >= 0) { mine = subs.splice(meIdx, 1)[0]; subs.unshift(mine); }
      const stage = stageTag(p);
      const round = roundTag(p);
      const my = myStateTag(p, mine, stage);

      const fp = UI.openFullPage({ backLabel: '프로젝트' });

      // 헤더 — 회차 · 전체 단계(보조). 내 진행 상태/제출 버튼은 문제 탭 우측 CTA로 분리.
      const head = document.createElement('div');
      head.innerHTML = `
        <div style="display:flex; align-items:center; gap:10px; margin-bottom: 8px;">
          <span class="tag tag-small ${round.cls}" data-slot="round"></span>
          <span class="tag tag-small ${stage.cls}" data-slot="stage"></span>
        </div>
        <h1 style="font-size: 28px; font-weight: 700; margin: 0 0 8px; color: var(--lk-color-fg-strong); letter-spacing: -0.02em;" data-slot="title"></h1>
        <div class="meta-row" style="margin-bottom: 24px;">
          <div class="meta-pill"><span class="label">제출 기간</span><span data-slot="sf"></span> ~ <span data-slot="st"></span></div>
          <div class="meta-pill"><span class="label">피드백 기간</span><span data-slot="ff"></span> ~ <span data-slot="ft"></span></div>
        </div>
      `;
      head.querySelector('[data-slot="round"]').textContent = round.label;
      head.querySelector('[data-slot="stage"]').textContent = stageWithDday(p, stage);
      head.querySelector('[data-slot="title"]').textContent = p.title;
      head.querySelector('[data-slot="sf"]').textContent = UI.fmtDate(p.submitFrom, { compact: true });
      head.querySelector('[data-slot="st"]').textContent = UI.fmtDate(p.submitTo, { compact: true });
      head.querySelector('[data-slot="ff"]').textContent = UI.fmtDate(p.feedbackFrom, { compact: true });
      head.querySelector('[data-slot="ft"]').textContent = UI.fmtDate(p.feedbackTo, { compact: true });
      fp.body.appendChild(head);

      // 제출 프로젝트 리스트(다른 학생 제출본)는 제출 기간이 끝난 뒤(피드백 기간부터) 전체 공개 — 제출 여부 무관 (POL-CR-03 §6.2)
      const boardOpen = stage.key === 'feedback' || stage.key === 'closed';
      // 3탭 (제출하기는 탭이 아니라 문제 탭 좌측 버튼으로 이동 — POL-CR-03 §6.2)
      const tabs = [
        { key: 'problem', label: '문제', icon: 'ri-file-list-3-line' },
        { key: 'board', label: '제출 프로젝트 리스트', icon: 'ri-group-line', locked: !boardOpen },
        { key: 'feedback', label: '받은 피드백', icon: 'ri-chat-3-line' },
      ];
      const tabsEl = document.createElement('div');
      tabsEl.className = 'tabs';
      tabsEl.style.marginBottom = '24px';
      tabs.forEach((t, idx) => {
        const btn = document.createElement('button');
        btn.className = 'tab' + (idx === 0 ? ' is-active' : '');
        if (t.locked) btn.setAttribute('data-locked', 'true');
        btn.innerHTML = `${t.locked ? '<i class="ri-icon ri-lock-line"></i>' : `<i class="ri-icon ${t.icon}"></i>`} ${t.label}`;
        btn.addEventListener('click', () => {
          tabsEl.querySelectorAll('.tab').forEach((x) => x.classList.remove('is-active'));
          btn.classList.add('is-active');
          renderPane(t.key);
        });
        tabsEl.appendChild(btn);
      });
      fp.body.appendChild(tabsEl);

      const pane = document.createElement('div');
      pane.id = 'pane';
      fp.body.appendChild(pane);

      function renderPane(key) {
        pane.innerHTML = '';
        if (key === 'problem') renderProblemPane(pane, p, {
          my, stage, mine, btn: submitBtnInfo(p, mine, stage),
          onSubmit: () => openSubmitForm(p, sid, mine, stage),
        });
        else if (key === 'board') renderBoardPane(pane, p, sid, mine, subs);
        else renderFeedbackPane(pane, p, mine);
      }
      renderPane('problem');
    }

    // 문제 탭 — cta가 있으면(학생) 좌측 제출 CTA + 우측 설명 2열, 없으면(매니저) 설명만
    function renderProblemPane(pane, p, cta) {
      if (!cta) {
        const wrap = document.createElement('div');
        wrap.className = 'card';
        wrap.style.maxWidth = '880px';
        const md = document.createElement('div');
        md.className = 'md-view';
        md.innerHTML = UI.md(p.description);
        wrap.appendChild(md);
        pane.appendChild(wrap);
        return;
      }
      const grid = document.createElement('div');
      grid.style.cssText = 'display:grid; grid-template-columns: minmax(0,1fr) 300px; gap:24px; align-items:start;';
      // 우측에 둘 제출 CTA (DOM 순서상 먼저 만들고, 그리드엔 설명 다음에 append)
      const left = document.createElement('aside');
      left.className = 'card';
      left.style.cssText = 'position:sticky; top:16px;';
      const dd = stageWithDday(p, cta.stage);
      left.innerHTML = `
        <div class="card-meta" style="margin-bottom:8px;">내 진행 상태</div>
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:16px;">
          <span class="tag ${cta.my.cls}" data-slot="my"></span>
          <span class="tag tag-small ${cta.stage.cls}" data-slot="stg"></span>
          <span data-slot="fbicon"></span>
        </div>
        <div id="cta-btn"></div>
      `;
      left.querySelector('[data-slot="my"]').textContent = cta.my.label;
      left.querySelector('[data-slot="stg"]').textContent = dd;
      left.querySelector('[data-slot="fbicon"]').innerHTML = feedbackBadge(cta.mine);
      const b = UI.button({ label: cta.btn.label, icon: cta.btn.icon, type: 'solid', color: 'primary', size: 'medium', disabled: cta.btn.disabled, onClick: cta.onSubmit });
      b.style.width = '100%';
      left.querySelector('#cta-btn').appendChild(b);
      // 좌: 문제 설명 (먼저 배치)
      const right = document.createElement('div');
      right.className = 'card';
      const md = document.createElement('div');
      md.className = 'md-view';
      md.innerHTML = UI.md(p.description);
      right.appendChild(md);
      grid.appendChild(right);  // 좌측 = 설명
      grid.appendChild(left);   // 우측 = 내 상태 + 제출 버튼
      pane.appendChild(grid);
    }

    // 제출/수정 폼 — fullpage (제출 진행 기간에만 진입)
    function openSubmitForm(p, sid, prev, stage) {
      if (!stage || stage.key !== 'submitting') { UI.toast('지금은 제출 진행 기간이 아니에요', 'danger'); return; }
      const fp = UI.openFullPage({ backLabel: p.title });
      const placeholder = '# 문제 정의\n\n\n# 핵심 기능\n\n\n# Tech Stack\n\n\n# 주요 트러블슈팅\n\n\n# 팀 소개\n';
      // 매니저가 설정한 제출 폼 옵션 — 필수 여부 (기본: URL·시연영상 필수, 첨부 선택)
      const opts = p.submitOptions || { projectUrl: true, demoVideo: true, attachment: false };
      const reqMark = (c) => c ? '<span class="req">*</span>' : ' <span class="text-mute" style="font-weight:400;">(선택)</span>';

      const card = document.createElement('div');
      card.className = 'card';
      card.style.maxWidth = '760px';
      card.innerHTML = `
        <h3 class="card-title">${prev ? '프로젝트 수정하기' : '프로젝트 제출하기'}</h3>
        <p class="text-mute" style="font-size: 13px; margin: 8px 0 20px;">${prev ? '마감 전까지 자유롭게 수정할 수 있어요' : '필수(<span class="req">*</span>) 항목을 모두 채우면 제출돼요'}</p>
        <div class="field"><label>프로젝트 제목<span class="req">*</span></label><input type="text" id="t" /></div>
        <div class="field"><label>한 줄 소개<span class="req">*</span></label><input type="text" id="ol" /></div>
        <div class="field"><label>프로젝트 설명<span class="req">*</span></label><textarea id="body" style="min-height: 240px; font-family: ui-monospace, monospace;"></textarea></div>
        <div class="field"><label>메인 이미지<span class="req">*</span></label><input type="text" placeholder="파일 선택 (최대 30MB)" disabled /></div>
        <div class="field"><label>프로젝트 URL${reqMark(opts.projectUrl)} · 다중 (GitHub · Web · Figma 등)</label><input type="url" id="u1" placeholder="https://github.com/..." /></div>
        <div class="field"><label>시연 영상 URL${reqMark(opts.demoVideo)} · YouTube / Vimeo</label><input type="url" id="vid" placeholder="https://youtu.be/..." /></div>
        <div class="field-row">
          <div class="field"><label>발표자료 <span class="text-mute" style="font-weight:400;">(선택)</span></label><input type="text" placeholder="파일 선택" disabled /></div>
          <div class="field"><label>첨부파일${reqMark(opts.attachment)} · 30MB</label><input type="text" placeholder="파일 선택" disabled /></div>
        </div>
        <div class="inline-error hide" id="vid-err">YouTube 또는 Vimeo 링크만 등록 가능해요</div>

        <div class="banner banner-info" style="margin-top: 20px;"><i class="ri-icon ri-information-line"></i><span>외부 공유는 제출 후 <strong>제출 프로젝트 리스트 → 내 제출본 → 외부 공유하기</strong>에서 할 수 있어요.</span></div>

        <div class="row row-end" style="margin-top: 16px; gap: 8px;" id="actions"></div>
      `;
      card.querySelector('#t').value = prev?.title || `${p.round} 프로젝트`;
      card.querySelector('#ol').value = prev?.oneLiner || '';
      card.querySelector('#body').value = prev?.description || placeholder;
      card.querySelector('#actions').appendChild(UI.button({ label: '임시저장', type: 'outline', color: 'neutral', onClick: () => UI.toast('임시저장됨', 'success') }));
      card.querySelector('#actions').appendChild(UI.button({ label: prev ? '수정 저장' : '제출하기', type: 'solid', color: 'primary', icon: 'ri-upload-cloud-line', onClick: () => {
        const val = (sel) => (card.querySelector(sel).value || '').trim();
        const missing = [];
        if (!val('#t')) missing.push('프로젝트 제목');
        if (!val('#ol')) missing.push('한 줄 소개');
        if (!val('#body')) missing.push('프로젝트 설명');
        if (opts.projectUrl && !val('#u1')) missing.push('프로젝트 URL');
        if (opts.demoVideo && !val('#vid')) missing.push('시연 영상 URL');
        if (missing.length) { UI.toast(`필수 항목을 입력해주세요: ${missing.join(', ')}`, 'danger'); return; }
        const vid = val('#vid');
        if (vid && !/(youtu\.be|youtube\.com|vimeo\.com)/.test(vid)) { card.querySelector('#vid-err').classList.remove('hide'); return; }
        UI.closeFullPage();
        UI.toast(`${prev ? '수정 저장' : '제출 완료'} — 클래스 게시판에 공개되었어요`, 'success');
      } }));
      fp.body.appendChild(card);
    }

    // ===== 수업 제출본 — 제출 기간 종료(피드백 기간)부터 전체 공개 · 본인 맨 앞 + 클릭시 외부 공유 =====
    function renderBoardPane(pane, p, sid, mine, subs) {
      const stage = stageTag(p);
      const boardOpen = stage.key === 'feedback' || stage.key === 'closed';
      if (!boardOpen) {
        // 제출 기간 중에는 비공개 — 제출 여부와 무관하게 잠금 (베끼기 방지 + 마감 후 일괄 공개)
        const lock = document.createElement('div');
        lock.className = 'lock-card';
        const submitting = stage.key === 'submitting';
        lock.innerHTML = `
          <div class="lock-icon"><i class="ri-icon ri-lock-2-line"></i></div>
          <h4>제출 기간이 끝나면 공개돼요</h4>
          <p>제출 기간 동안에는 문제 풀이에 집중! <strong>피드백 기간부터</strong> 같은 수업의 모든 제출본이 공개되고,<br/>이때부터는 제출물 수정이 불가능해요.</p>
          <div id="cta"></div>
        `;
        // 제출 진행 중이고 아직 미제출이면 제출을 독려 (열람 게이트와 별개)
        if (submitting && !mine) {
          lock.querySelector('#cta').appendChild(UI.button({ label: '내 프로젝트 제출하러 가기', icon: 'ri-upload-cloud-line', type: 'solid', color: 'primary', onClick: () => openSubmitForm(p, sid, null, stage) }));
        }
        pane.appendChild(lock);
        return;
      }

      // 내 제출본은 1페이지 맨 앞에 고정(pin)하고, 페이지네이션 대상(others)에서는 제외한다.
      // → 2페이지부터는 내 제출본이 보이지 않는다 (POL-CR-03 §6.2 / PRD §4.5 B).
      const mineSub = (subs[0] && subs[0].studentId === sid) ? subs[0] : null;
      const others = mineSub ? subs.slice(1) : subs.slice();
      const PER_PAGE = 9;
      const pageCount = Math.max(1, Math.ceil(others.length / PER_PAGE));
      let page = 0;

      const head = document.createElement('div');
      head.className = 'section-head';
      head.style.margin = '0 0 16px';
      pane.appendChild(head);

      const board = document.createElement('div');
      board.className = 'board-grid';
      pane.appendChild(board);

      const pager = document.createElement('div');
      pager.style.cssText = 'display:flex; align-items:center; justify-content:center; gap:14px; margin-top:20px;';
      pane.appendChild(pager);

      function makeCard(s, pinned) {
        const card = document.createElement('div');
        card.className = 'board-card';
        card.style.position = 'relative';
        if (pinned) card.style.outline = '2px solid var(--lk-color-border-primary)';
        card.innerHTML = `
          ${s.excellent ? '<span class="tag tag-small tag-weak-enabled" style="position:absolute; top:8px; right:8px; z-index:1;"><i class="ri-icon ri-star-fill"></i> 우수</span>' : ''}
          <img class="thumb" loading="lazy" alt="" />
          <div class="body">
            <div class="row" style="gap: 4px;">
              ${pinned ? '<span class="tag tag-small tag-weak-enabled">내 제출본</span>' : ''}
            </div>
            <div class="title" data-slot="t"></div>
            <p class="meta" data-slot="o"></p>
            <div class="meta" style="margin-top: 6px;" data-slot="by"></div>
          </div>
        `;
        card.querySelector('img').src = s.mainImage;
        card.querySelector('[data-slot="t"]').textContent = s.title;
        card.querySelector('[data-slot="o"]').textContent = s.oneLiner;
        card.querySelector('[data-slot="by"]').textContent = `by ${UI.displayName(s, { hideDropout: true })}`;
        card.addEventListener('click', () => openSubmissionView(s, s.studentId === sid));
        return card;
      }

      function renderPage() {
        const pinnedHere = page === 0 && mineSub;
        head.innerHTML = `<h3>제출 프로젝트 리스트</h3><span class="hint">${MOCK.meta.cohortName} · 총 ${subs.length}건${pinnedHere ? ' · 내 프로젝트가 가장 먼저 보여요' : (mineSub ? ' · 내 프로젝트는 1페이지에 있어요' : '')}</span>`;

        board.innerHTML = '';
        if (pinnedHere) board.appendChild(makeCard(mineSub, true));
        others.slice(page * PER_PAGE, page * PER_PAGE + PER_PAGE).forEach((s) => board.appendChild(makeCard(s, false)));

        pager.innerHTML = '';
        if (pageCount <= 1) return;
        pager.appendChild(UI.button({ label: '이전', icon: 'ri-arrow-left-s-line', type: 'ghost', color: 'neutral', size: 'small', disabled: page <= 0, onClick: () => { page--; renderPage(); pane.scrollIntoView?.({ block: 'nearest' }); } }));
        const lbl = document.createElement('span');
        lbl.style.cssText = 'font-size:13px; color:var(--lk-color-fg-neutral); min-width:120px; text-align:center;';
        lbl.textContent = `${page + 1} / ${pageCount} · 총 ${subs.length}건`;
        pager.appendChild(lbl);
        pager.appendChild(UI.button({ label: '다음', icon: 'ri-arrow-right-s-line', type: 'ghost', color: 'neutral', size: 'small', disabled: page >= pageCount - 1, onClick: () => { page++; renderPage(); pane.scrollIntoView?.({ block: 'nearest' }); } }));
      }
      renderPage();
    }

    function openSubmissionView(s, isOwn) {
      const fp = UI.openFullPage({ backLabel: '수업 제출본' });
      if (isOwn) {
        // 외부 공유 버튼
        fp.actions.appendChild(UI.button({ label: '외부 공유하기', icon: 'ri-share-line', type: 'solid', color: 'primary', size: 'medium', onClick: () => {
          openShareDialog(s);
        } }));
      }
      fp.body.innerHTML = `
        <div style="display:flex; align-items:center; gap:10px; margin-bottom: 8px;">
          ${isOwn ? '<span class="tag tag-small tag-weak-enabled">내 제출본</span>' : ''}
          <span class="card-meta" data-slot="by"></span>
          ${s.excellent ? '<span class="tag tag-small tag-weak-enabled"><i class="ri-icon ri-star-fill"></i> 우수</span>' : ''}
        </div>
        <h1 style="font-size: 28px; font-weight: 700; margin: 0 0 8px; color: var(--lk-color-fg-strong); letter-spacing: -0.02em;" data-slot="t"></h1>
        <p class="text-mute" style="font-size: 14px; margin: 0 0 24px;" data-slot="ol"></p>
        <img alt="" style="width: 100%; max-width: 720px; aspect-ratio: 16/9; object-fit: cover; border-radius: 12px; margin-bottom: 24px;" data-slot="img"/>
        <div class="md-view" data-slot="body" style="max-width: 880px;"></div>
        <div class="divider" style="max-width: 880px;"></div>
        <div class="row" style="gap: 10px;">
          <a class="btn btn-outline-neutral btn-small" data-slot="gh" target="_blank">GitHub 보기</a>
          <a class="btn btn-outline-neutral btn-small" data-slot="vid" target="_blank">시연 영상 보기</a>
        </div>
      `;
      fp.body.querySelector('[data-slot="by"]').textContent = `by ${UI.displayName(s, { hideDropout: true })} · ${UI.fmtDate(s.submittedAt, { compact: true })}`;
      fp.body.querySelector('[data-slot="t"]').textContent = s.title;
      fp.body.querySelector('[data-slot="ol"]').textContent = s.oneLiner;
      fp.body.querySelector('[data-slot="img"]').src = s.mainImage;
      fp.body.querySelector('[data-slot="body"]').innerHTML = UI.md(s.description);
      fp.body.querySelector('[data-slot="gh"]').href = s.urls[0] || '#';
      fp.body.querySelector('[data-slot="vid"]').href = s.videoUrl || '#';
    }

    function openShareDialog(s, opts = {}) {
      // 학생 외부 공유 토글 — 코호트 내 공유는 항상 고정. 외부(로그인 없이 별도 주소 열람)만 켜고 끔.
      // 매니저가 외부 공개를 제한한 경우(externalRestricted) 토글 비활성 + 사유 표시.
      const shareUrl = `https://likelion-classroom.app/share/${s.studentId}-${s.title.length}`;
      const node = UI.openModal(`
        <h3 class="card-title" data-slot="dtitle"></h3>
        <p class="text-mute" style="font-size: 13px; margin: 8px 0 16px;">코호트(수업) 내 공유는 항상 유지돼요. 여기서는 <strong>외부 공개</strong>(로그인 없이 별도 주소로 누구나 열람)만 켜고 끌 수 있어요.</p>
        <div id="restrict-note" class="banner banner-error" style="display:none; margin-bottom:14px; align-items:flex-start;"><i class="ri-icon ri-lock-line"></i><span><strong>매니저가 외부 공개를 제한했어요.</strong><br/><span data-slot="reason" style="display:block; margin-top:4px; line-height:1.6;"></span><span style="display:block; margin-top:6px; color:var(--lk-color-fg-neutral);">해제하려면 매니저·강사에게 사유를 설명하고 요청해 주세요.</span></span></div>
        <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:var(--lk-color-bg-normal); border-radius:10px;">
          <div>
            <div style="font-size:14px; font-weight:600; color:var(--lk-color-fg-strong);" data-slot="swlabel"></div>
            <div class="text-mute" style="font-size:12px; margin-top:2px;" data-slot="state"></div>
          </div>
          <button id="sw" role="switch" aria-label="외부 공개 토글" style="position:relative; width:46px; height:26px; border-radius:9999px; border:none; cursor:pointer; transition:background .15s; flex:0 0 auto;"><span id="knob" style="position:absolute; top:3px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.2); transition:left .15s;"></span></button>
        </div>
        <div id="link-row" style="margin-top:14px; background:var(--lk-color-bg-normal); padding:14px 16px; border-radius:10px; display:flex; align-items:center; gap:12px;">
          <span style="font-size:13px; font-family:ui-monospace,monospace; flex:1; overflow:hidden; text-overflow:ellipsis;" data-slot="url"></span>
          <button class="btn btn-small btn-solid-primary" id="copy">링크 복사</button>
        </div>
        <div class="row row-end" style="margin-top:16px;"><button class="btn btn-outline-neutral" id="close">닫기</button></div>
      `);
      node.querySelector('[data-slot="dtitle"]').textContent = opts.title || '외부 공유하기';
      node.querySelector('[data-slot="swlabel"]').textContent = opts.toggleLabel || '외부 공개';
      node.querySelector('[data-slot="url"]').textContent = shareUrl;
      const sw = node.querySelector('#sw'), knob = node.querySelector('#knob'), linkRow = node.querySelector('#link-row'), copy = node.querySelector('#copy'), state = node.querySelector('[data-slot="state"]'), restrictNote = node.querySelector('#restrict-note');
      function render() {
        const restricted = !!s.externalRestricted;
        const on = !restricted && !!s.published;
        restrictNote.style.display = restricted ? 'flex' : 'none';
        if (restricted) node.querySelector('[data-slot="reason"]').textContent = s.restrictReason || '';
        sw.style.background = on ? 'var(--lk-color-bg-primary)' : 'var(--lk-color-border-normal)';
        knob.style.left = on ? '23px' : '3px';
        sw.disabled = restricted; sw.style.cursor = restricted ? 'not-allowed' : 'pointer'; sw.style.opacity = restricted ? '0.5' : '1';
        state.textContent = restricted ? '매니저 제한 중 — 외부 공개 불가' : (on ? '외부 공개 중 — 링크로 누구나 열람 가능' : '외부 비공개 — 링크 비활성화');
        linkRow.style.opacity = on ? '1' : '0.45';
        copy.disabled = !on;
        copy.style.cursor = on ? 'pointer' : 'not-allowed';
      }
      render();
      sw.addEventListener('click', () => {
        if (s.externalRestricted) { UI.toast('매니저가 외부 공개를 제한했어요', 'danger'); return; }
        s.published = !s.published; render(); if (opts.onChange) opts.onChange();
        UI.toast(s.published ? '외부 공개로 전환했어요 — 링크가 생성됐어요' : '외부 비공개로 전환했어요', 'success');
      });
      copy.addEventListener('click', () => { if (!s.published || s.externalRestricted) return; UI.toast('링크를 복사했어요', 'success'); });
      node.querySelector('#close').addEventListener('click', () => { node.remove(); if (opts.onChange) opts.onChange(); });
    }

    // 매니저 — 외부 공개 제한/해제 (제한 시 사유 필수)
    function openRestrictDialog(s, opts = {}) {
      if (s.externalRestricted) {
        const node = UI.openModal(`
          <h3 class="card-title" style="margin-bottom:8px;">외부 공개 제한 해제</h3>
          <p class="text-mute" style="font-size:13px; margin:0 0 14px;">현재 외부 공개가 제한되어 있어요. 해제하면 학생이 다시 외부 공개를 켤 수 있어요.</p>
          <div class="banner banner-error" style="margin-bottom:16px; align-items:flex-start;"><i class="ri-icon ri-lock-line"></i><span data-slot="reason" style="line-height:1.6;"></span></div>
          <div class="row row-end" style="gap:8px;" id="acts"></div>
        `);
        node.querySelector('[data-slot="reason"]').textContent = s.restrictReason || '';
        node.querySelector('#acts').appendChild(UI.button({ label: '취소', type: 'outline', color: 'neutral', onClick: () => node.remove() }));
        node.querySelector('#acts').appendChild(UI.button({ label: '제한 해제', icon: 'ri-lock-unlock-line', type: 'solid', color: 'primary', onClick: () => { s.externalRestricted = false; s.restrictReason = null; node.remove(); UI.toast('외부 공개 제한을 해제했어요', 'success'); if (opts.onChange) opts.onChange(); } }));
      } else {
        const node = UI.openModal(`
          <h3 class="card-title" style="margin-bottom:8px;">외부 공개 제한</h3>
          <p class="text-mute" style="font-size:13px; margin:0 0 14px;">외부 공개(로그인 없이 별도 주소 열람)를 제한해요. 코호트 내 공유는 그대로 유지돼요. 사유는 학생의 외부 공유 화면에 표시되며, 해제는 매니저만 할 수 있어요.</p>
          <div class="field"><label>제한 사유<span class="req">*</span></label><textarea id="reason" style="min-height:110px;" placeholder="예: 외부 비공개 데이터셋(고객 PII)이 포함되어 있어 외부 공개를 제한합니다."></textarea></div>
          <div class="row row-end" style="gap:8px;" id="acts"></div>
        `);
        node.querySelector('#acts').appendChild(UI.button({ label: '취소', type: 'outline', color: 'neutral', onClick: () => node.remove() }));
        node.querySelector('#acts').appendChild(UI.button({ label: '외부 공개 제한', icon: 'ri-lock-line', type: 'solid', color: 'danger', onClick: () => {
          const reason = node.querySelector('#reason').value.trim();
          if (!reason) { UI.toast('제한 사유를 입력해주세요', 'danger'); return; }
          s.externalRestricted = true; s.restrictReason = reason; s.published = false;
          node.remove(); UI.toast('외부 공개를 제한했어요', 'success'); if (opts.onChange) opts.onChange();
        } }));
      }
    }

        return;

      if (!mine.feedback) {
        pane.appendChild(UI.emptyCard({
          icon: 'ri-chat-3-line',
          title: '아직 받은 피드백이 없어요',
          body: isInFeedbackPeriod(p) ? '피드백 기간 중 매니저가 작성하면 여기에 표시됩니다.' : '피드백 기간이 시작되면 표시됩니다.',
        }));
        return;
      }
      const card = document.createElement('div');
      card.className = 'card';
      card.style.maxWidth = '760px';
      card.innerHTML = `

          <div>
            <h3 class="card-title">매니저 피드백</h3>
            <p class="text-mute" style="font-size: 12px; margin-top: 4px;">본인만 보여요 · 다른 학생에게는 노출되지 않음</p>
          </div>
          <span class="tag tag-small tag-weak-success">피드백 완료</span>
        </div>
        <div style="background: var(--lk-color-bg-primary-weak); padding: 16px 20px; border-radius: 10px; margin-top: 12px;">
          <p style="font-size: 14px; line-height: 1.7; margin: 0; color: var(--lk-color-fg-pressed);" data-slot="fb"></p>
        </div>

      card.querySelector('[data-slot="fb"]').textContent = mine.feedback;
      pane.appendChild(card);
    }

    // ============================================================
    // 매니저뷰
    // ============================================================
    function renderManager() {
      // 단계 정렬 우선순위 — 진행중(제출>피드백)을 위로, 예정·종료는 아래
      const STAGE_ORDER = { submitting: 0, feedback: 1, scheduled: 2, closed: 3 };
      const list = document.createElement('div');
      list.className = 'project-wide-list';
      const sorted = MOCK.projects.slice().sort((a, b) => STAGE_ORDER[stageTag(a).key] - STAGE_ORDER[stageTag(b).key]);
      sorted.forEach((p) => {
        const subs = MOCK.projectSubmissions[p.id] || [];
        // 전체 학생수(분모)·제출자(분자)는 중도포기자를 제외한 재적생 기준으로 집계한다.
        // (제출본 자체는 보존 — 중도포기자가 낸 제출본도 제출현황에 그대로 남는다.)
        const activeTotal = MOCK.students.filter((s) => !UI.isDropped(s)).length;
        const activeSubs = subs.filter((s) => !UI.isDropped(s)).length;
        const rate = activeTotal ? Math.round(activeSubs / activeTotal * 100) : 0;
        const stage = stageTag(p);
        const round = roundTag(p);
        const card = document.createElement('div');
        card.className = 'project-wide-card';
        card.style.cssText = 'display:flex; gap:24px; align-items:stretch; justify-content:space-between;';
        card.innerHTML = `
          <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:10px;">
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
              <span class="title" data-slot="title" style="font-size:17px; font-weight:700; color:var(--lk-color-fg-strong);"></span>
              <span class="tag tag-small ${round.cls}" data-slot="round"></span>
            </div>
            <div><span class="tag ${stage.cls}" data-slot="stage"></span></div>
            <div class="meta-row" style="margin:0;">
              <div class="meta-pill"><span class="label">제출 기간</span><span data-slot="sf"></span> ~ <span data-slot="st"></span></div>
              <div class="meta-pill"><span class="label">피드백 기간</span><span data-slot="ff"></span> ~ <span data-slot="ft"></span></div>
            </div>
          </div>
          <div style="flex:0 0 200px; border-left:1px solid var(--lk-color-border-weak); padding-left:24px; display:flex; flex-direction:column; justify-content:center; gap:8px;">
            <div style="display:flex; align-items:baseline; gap:6px;">
              <span style="font-size:30px; font-weight:800; color:var(--lk-color-fg-primary); line-height:1;" data-slot="rate"></span>
              <span style="font-size:13px; color:var(--lk-color-fg-alternative);">제출률</span>
            </div>
            <div style="height:8px; border-radius:9999px; background:var(--lk-color-bg-normal); overflow:hidden;"><div data-slot="bar" style="height:100%; background:var(--lk-color-bg-primary); border-radius:9999px;"></div></div>
            <div style="font-size:13px; color:var(--lk-color-fg-neutral);"><i class="ri-icon ri-team-line"></i> 제출 훈련생 <strong data-slot="sc"></strong></div>
            <div style="font-size:11px; color:var(--lk-color-fg-alternative);">전체 인원은 중도포기자 제외</div>
          </div>
        `;
        card.querySelector('[data-slot="round"]').textContent = round.label;
        card.querySelector('[data-slot="stage"]').textContent = stageWithDday(p, stage);
        card.querySelector('[data-slot="title"]').textContent = p.title;
        card.querySelector('[data-slot="sf"]').textContent = UI.fmtDate(p.submitFrom, { compact: true });
        card.querySelector('[data-slot="st"]').textContent = UI.fmtDate(p.submitTo, { compact: true });
        card.querySelector('[data-slot="ff"]').textContent = UI.fmtDate(p.feedbackFrom, { compact: true });
        card.querySelector('[data-slot="ft"]').textContent = UI.fmtDate(p.feedbackTo, { compact: true });
        card.querySelector('[data-slot="rate"]').textContent = `${rate}%`;
        card.querySelector('[data-slot="bar"]').style.width = `${rate}%`;
        card.querySelector('[data-slot="sc"]').textContent = `${activeSubs} / ${activeTotal}명`;
        card.addEventListener('click', () => openManagerDetail(p, subs));
        list.appendChild(card);
      });
      root.appendChild(list);
    }

    // ===== 매니저 상세 — 2탭 (문제 / 제출현황). 피드백은 제출현황 내부에서 진행 =====
    function openManagerDetail(p, subs) {
      const fp = UI.openFullPage({ backLabel: '프로젝트' });
      fp.actions.appendChild(UI.button({ label: '프로젝트 정보 수정', icon: 'ri-edit-line', type: 'outline', color: 'neutral', size: 'medium', onClick: () => openProjectEditModal(p) }));

      const stage = stageTag(p);
      const round = roundTag(p);
      // 통계(제출률·제출 N/M·미제출)는 중도포기자를 제외한 재적생 기준. 제출본(subs)은 보존.
      const activeTotal = MOCK.students.filter((s) => !UI.isDropped(s)).length;
      const activeSubCount = subs.filter((s) => !UI.isDropped(s)).length;
      const unsubmittedCount = Math.max(0, activeTotal - activeSubCount);
      const rate = activeTotal ? Math.round(activeSubCount / activeTotal * 100) : 0;

      // 헤더 — 리스트와 동일한 우선순위: 제목+종류 → 단계 → 기간 → 제출현황
      fp.body.innerHTML = `
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
          <h1 style="font-size: 26px; font-weight: 700; margin: 0; color: var(--lk-color-fg-strong); letter-spacing: -0.02em;" data-slot="title"></h1>
          <span class="tag tag-small ${round.cls}" data-slot="round"></span>
          <span class="tag ${stage.cls}" data-slot="stage"></span>
        </div>
        <div style="display:flex; align-items:center; gap:20px; flex-wrap:wrap; margin-bottom:28px; padding:14px 18px; background:var(--lk-color-bg-normal); border-radius:12px;">
          <div style="font-size:13px; color:var(--lk-color-fg-neutral);"><span style="color:var(--lk-color-fg-strong); font-weight:600;">제출 기간</span> <span data-slot="sp"></span></div>
          <span style="color:var(--lk-color-border-normal);">|</span>
          <div style="font-size:13px; color:var(--lk-color-fg-neutral);"><span style="color:var(--lk-color-fg-strong); font-weight:600;">피드백 기간</span> <span data-slot="fp"></span></div>
          <div style="margin-left:auto; display:flex; align-items:center; gap:8px;">
            <span style="font-size:22px; font-weight:800; color:var(--lk-color-fg-primary);" data-slot="rate"></span>
            <span style="font-size:13px; color:var(--lk-color-fg-neutral);">제출 <strong data-slot="sc"></strong></span>
            <span style="font-size:12px; color:var(--lk-color-fg-alternative);">(중도포기자 제외)</span>
          </div>
        </div>

        <div class="tabs" style="margin-bottom: 24px;">
          <button class="tab is-active" data-mtab="problem"><i class="ri-icon ri-file-list-3-line"></i> 문제</button>
          <button class="tab" data-mtab="board"><i class="ri-icon ri-group-line"></i> 제출현황 (${subs.length})</button>
          <button class="tab" data-mtab="unsubmitted"><i class="ri-icon ri-user-unfollow-line"></i> 미제출명단 (${unsubmittedCount})</button>
        </div>
        <div id="mpane"></div>
      `;
      fp.body.querySelector('[data-slot="round"]').textContent = round.label;
      fp.body.querySelector('[data-slot="stage"]').textContent = stageWithDday(p, stage);
      fp.body.querySelector('[data-slot="title"]').textContent = p.title;
      fp.body.querySelector('[data-slot="sp"]').textContent = `${UI.fmtDate(p.submitFrom, { compact: true })} ~ ${UI.fmtDate(p.submitTo, { compact: true })}`;
      fp.body.querySelector('[data-slot="fp"]').textContent = `${UI.fmtDate(p.feedbackFrom, { compact: true })} ~ ${UI.fmtDate(p.feedbackTo, { compact: true })}`;
      fp.body.querySelector('[data-slot="sc"]').textContent = `${activeSubCount} / ${activeTotal}명`;
      fp.body.querySelector('[data-slot="rate"]').textContent = `${rate}%`;

      const mpane = fp.body.querySelector('#mpane');
      function rmgr(k) {
        mpane.innerHTML = '';
        if (k === 'problem') renderProblemPane(mpane, p);
        else if (k === 'unsubmitted') renderMgrUnsubmittedPane(mpane, p, subs);
        else renderMgrBoardPane(mpane, p, subs);
      }
      fp.body.querySelectorAll('[data-mtab]').forEach((b) => b.addEventListener('click', () => {
        fp.body.querySelectorAll('[data-mtab]').forEach((x) => x.classList.remove('is-active'));
        b.classList.add('is-active');
        rmgr(b.dataset.mtab);
      }));
      rmgr('problem');
    }

    // 제출현황 — 필터(전체/피드백 전/피드백 완료) + 썸네일 위 피드백 태그. 카드 클릭 시 제출본+피드백 진행
    function renderMgrBoardPane(pane, p, subs) {
      let filter = 'all';
      const need = subs.filter((s) => !s.feedback).length;
      const done = subs.length - need;
      const head = document.createElement('div');
      head.className = 'section-head';
      head.style.margin = '0 0 14px';
      head.innerHTML = `<h3>제출현황</h3><span class="hint">총 ${subs.length}건 · 피드백 완료 ${done} · 피드백 전 ${need}</span>`;
      pane.appendChild(head);

      const filterRow = document.createElement('div');
      filterRow.className = 'tabs-round';
      filterRow.style.marginBottom = '16px';
      [['all', '전체'], ['need', '피드백 전'], ['done', '피드백 완료']].forEach(([k, label], i) => {
        const b = document.createElement('button');
        b.className = 'tab' + (i === 0 ? ' is-active' : '');
        b.textContent = label;
        b.addEventListener('click', () => { filter = k; filterRow.querySelectorAll('.tab').forEach((x) => x.classList.remove('is-active')); b.classList.add('is-active'); draw(); });
        filterRow.appendChild(b);
      });
      pane.appendChild(filterRow);

      const board = document.createElement('div');
      board.className = 'board-grid';
      pane.appendChild(board);

      function draw() {
        board.innerHTML = '';
        const items = UI.sortDropoutLast(subs.filter((s) => filter === 'all' ? true : filter === 'done' ? !!s.feedback : !s.feedback));
        if (items.length === 0) {
          board.appendChild(UI.emptyCard({ icon: 'ri-inbox-line', title: '해당하는 제출본이 없어요', body: '다른 필터를 선택해보세요.' }));
          return;
        }
        items.forEach((s) => {
          const c = document.createElement('div');
          c.className = 'board-card';
          c.style.position = 'relative';
          // 중도포기자의 제출본도 삭제·비활성화하지 않고 그대로 보존한다 (배지로만 식별).
          c.innerHTML = `
            <span class="tag tag-small ${s.feedback ? 'tag-weak-success' : 'tag-weak-warning'}" style="position:absolute; top:8px; left:8px; z-index:1;">${s.feedback ? '피드백 완료' : '피드백 전'}</span>
            ${s.excellent ? '<span class="tag tag-small tag-weak-enabled" style="position:absolute; top:8px; right:8px; z-index:1;"><i class="ri-icon ri-star-fill"></i> 우수</span>' : ''}
            <img class="thumb" loading="lazy" alt="" />
            <div class="body">
              <div class="row" style="gap: 4px;">
                ${shareStatusTag(s, { always: true })}${UI.dropoutTag(s)}
              </div>
              <div class="title" data-slot="t"></div>
              <div class="meta" data-slot="by"></div>
            </div>
          `;
          c.querySelector('img').src = s.mainImage;
          c.querySelector('[data-slot="t"]').textContent = s.title;
          c.querySelector('[data-slot="by"]').textContent = `by ${UI.displayName(s)}`;
          c.addEventListener('click', () => openMgrSubmission(p, s, draw));
          board.appendChild(c);
        });
      }
      draw();
    }

    // 미제출명단 — 제출하지 않은 '재적생'만 표시 (중도포기자는 미제출명단에서 제외)
    function renderMgrUnsubmittedPane(pane, p, subs) {
      const submittedIds = new Set(subs.map((s) => s.studentId));
      const activeStudents = MOCK.students.filter((s) => !UI.isDropped(s));
      const unsubmitted = activeStudents.filter((s) => !submittedIds.has(s.id));

      const head = document.createElement('div');
      head.className = 'section-head';
      head.style.margin = '0 0 16px';
      head.innerHTML = `<h3>미제출명단</h3><span class="hint">전체 ${activeStudents.length}명 중 미제출 ${unsubmitted.length}명 · 중도포기자 제외</span>`;
      pane.appendChild(head);

      if (unsubmitted.length === 0) {
        pane.appendChild(UI.emptyCard({ icon: 'ri-check-double-line', title: '모든 학생이 제출했어요 🎉', body: '미제출자가 없습니다.' }));
        return;
      }

      const list = document.createElement('div');
      list.className = 'note-list';
      unsubmitted.forEach((s) => {
        const row = document.createElement('div');
        row.className = 'quiz-row';
        if (UI.isDropped(s)) row.style.opacity = '0.6';
        row.innerHTML = `
          <div class="quiz-date"><i class="ri-icon ri-user-line"></i><span data-slot="no"></span></div>
          <div class="quiz-title" data-slot="name"></div>
          ${UI.dropoutTag(s)}
          <span class="tag tag-small tag-weak-warning">미제출</span>
        `;
        row.querySelector('[data-slot="no"]').textContent = `${s.no}번`;
        row.querySelector('[data-slot="name"]').textContent = UI.displayName(s);
        list.appendChild(row);
      });
      pane.appendChild(list);
    }

    // 매니저 제출본 상세 — 내용 + 하단 피드백 등록/수정 + 우수 마크 / 공개 설정
    function openMgrSubmission(p, s, onChange) {
      const fp = UI.openFullPage({ backLabel: p.title });
      fp.actions.appendChild(UI.button({ label: s.excellent ? '우수 해제' : '우수 마크', icon: 'ri-star-line', type: 'outline', color: 'neutral', size: 'medium', onClick: () => { s.excellent = !s.excellent; UI.closeFullPage(); UI.toast(s.excellent ? '우수로 표시했어요' : '우수 표시를 해제했어요', 'success'); if (onChange) onChange(); } }));
      fp.actions.appendChild(UI.button({ label: s.externalRestricted ? '외부 공개 제한 해제' : '외부 공개 제한', icon: s.externalRestricted ? 'ri-lock-unlock-line' : 'ri-lock-line', type: 'outline', color: s.externalRestricted ? 'neutral' : 'danger', size: 'medium', onClick: () => openRestrictDialog(s, { onChange: () => { UI.closeFullPage(); UI.toast('상태가 업데이트됐어요', 'success'); if (onChange) onChange(); } }) }));

      fp.body.innerHTML = `
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;" id="mgr-sub-tags">
          <span class="tag tag-small ${s.feedback ? 'tag-weak-success' : 'tag-weak-warning'}" data-slot="fbtag"></span>
          <span data-slot="pubtag"></span>
          ${s.excellent ? '<span class="tag tag-small tag-weak-enabled">우수</span>' : ''}
          <span class="card-meta" data-slot="by"></span>
        </div>
        <h1 style="font-size:26px; font-weight:700; margin:0 0 8px; color:var(--lk-color-fg-strong); letter-spacing:-0.02em;" data-slot="t"></h1>
        <p class="text-mute" style="font-size:14px; margin:0 0 24px;" data-slot="ol"></p>
        <img alt="" style="width:100%; max-width:720px; aspect-ratio:16/9; object-fit:cover; border-radius:12px; margin-bottom:24px;" data-slot="img"/>
        <div class="md-view" data-slot="body" style="max-width:880px;"></div>
        <div class="divider" style="max-width:880px;"></div>
        <div class="row" style="gap:10px;">
          <a class="btn btn-outline-neutral btn-small" data-slot="gh" target="_blank">GitHub 보기</a>
          <a class="btn btn-outline-neutral btn-small" data-slot="vid" target="_blank">시연 영상 보기</a>
        </div>
        <div class="card" style="max-width:880px; margin-top:24px;">
          <div class="card-head">
            <div><h3 class="card-title">피드백</h3><p class="text-mute" style="font-size:12px; margin-top:4px;">학생 본인에게만 노출 · 등록 후 수정 가능</p></div>
          </div>
          <div class="field" style="margin-top:12px;"><label>피드백 내용</label><textarea id="fb-text" placeholder="피드백을 작성하세요" style="min-height:200px;"></textarea></div>
          <div class="row row-end" id="fb-actions"></div>
        </div>
      `;
      function refreshHeaderTags() { const pt = fp.body.querySelector('[data-slot="pubtag"]'); if (pt) pt.innerHTML = shareStatusTag(s, { always: true }); }
      refreshHeaderTags();
      fp.body.querySelector('[data-slot="fbtag"]').textContent = s.feedback ? '피드백 완료' : '피드백 전';
      fp.body.querySelector('[data-slot="by"]').textContent = `by ${UI.displayName(s)} · ${UI.fmtDate(s.submittedAt, { compact: true })}`;
      fp.body.querySelector('[data-slot="t"]').textContent = s.title;
      fp.body.querySelector('[data-slot="ol"]').textContent = s.oneLiner;
      fp.body.querySelector('[data-slot="img"]').src = s.mainImage;
      fp.body.querySelector('[data-slot="body"]').innerHTML = UI.md(s.description);
      fp.body.querySelector('[data-slot="gh"]').href = (s.urls && s.urls[0]) || '#';
      fp.body.querySelector('[data-slot="vid"]').href = s.videoUrl || '#';
      fp.body.querySelector('#fb-text').value = s.feedback || '';
      fp.body.querySelector('#fb-actions').appendChild(UI.button({ label: s.feedback ? '피드백 수정 저장' : '피드백 등록', icon: 'ri-send-plane-line', type: 'solid', color: 'primary', onClick: () => {
        const val = fp.body.querySelector('#fb-text').value.trim();
        if (!val) { UI.toast('피드백 내용을 입력해주세요', 'danger'); return; }
        const wasEmpty = !s.feedback; s.feedback = val;
        UI.closeFullPage();
        UI.toast(`${UI.displayName(s)}에게 피드백을 ${wasEmpty ? '등록' : '저장'}했어요`, 'success');
        if (onChange) onChange();
      } }));
    }

    // 프로젝트 정보 수정 모달 (등록 시 입력 항목 전체 수정)
    function openProjectEditModal(p) {
      const node = UI.openModal(`
        <h3 class="card-title" style="margin-bottom:16px;">프로젝트 정보 수정</h3>
        <div class="field"><label>회차 종류</label><div id="round-sel"></div></div>
        <div class="field"><label>회차명</label><input type="text" id="e-title" /></div>
        <div class="field"><label>한 줄 소개</label><input type="text" id="e-ol" /></div>
        <div class="field"><label>문제 설명</label><div id="e-desc-mount"></div></div>
        <div class="field-row">
          <div class="field"><label>제출 시작</label><input type="date" id="e-sf" /></div>
          <div class="field"><label>제출 마감</label><input type="date" id="e-st" /></div>
        </div>
        <div class="field-row">
          <div class="field"><label>피드백 시작</label><input type="date" id="e-ff" /></div>
          <div class="field"><label>피드백 마감</label><input type="date" id="e-ft" /></div>
        </div>
        <div class="row row-end" style="gap:8px; margin-top:8px;" id="e-actions"></div>
      `);
      node.querySelector('#round-sel').appendChild(UI.select({ options: [{ value: '기초', label: '기초' }, { value: '심화', label: '심화' }, { value: '파이널', label: '파이널' }, { value: '기타', label: '기타' }], value: p.round }));
      node.querySelector('#e-title').value = p.title;
      node.querySelector('#e-ol').value = p.oneLiner || '';
      node.querySelector('#e-desc-mount').appendChild(UI.markdownEditor(p.description || '', { placeholder: '배경 / 문제 정의 / 요구 사항 / 제출물 / 평가 기준' }).el);
      node.querySelector('#e-sf').value = p.submitFrom;
      node.querySelector('#e-st').value = p.submitTo;
      node.querySelector('#e-ff').value = p.feedbackFrom;
      node.querySelector('#e-ft').value = p.feedbackTo;
      node.querySelector('#e-actions').appendChild(UI.button({ label: '취소', type: 'outline', color: 'neutral', onClick: () => node.remove() }));
      node.querySelector('#e-actions').appendChild(UI.button({ label: '저장', icon: 'ri-check-line', type: 'solid', color: 'primary', onClick: () => { node.remove(); UI.toast('프로젝트 정보가 수정되었어요', 'success'); } }));
    }

    // 매니저 회차 등록
    function openManagerCreate() {
      const fp = UI.openFullPage({ backLabel: '프로젝트' });
      fp.body.innerHTML = `
        <h1 style="font-size: 28px; font-weight: 700; margin: 0 0 24px;">프로젝트 등록</h1>
        <div class="card" style="max-width: 720px;">
          <div class="field"><label>회차 종류<span class="req">*</span></label><div id="round-sel"></div></div>
          <div class="field"><label>회차명<span class="req">*</span></label><input type="text" placeholder="예: 심화 — 머신러닝 모델링" /></div>
          <div class="field"><label>한 줄 소개<span class="req">*</span></label><input type="text" placeholder="예: 도메인 데이터로 모델을 학습하고 결과를 대시보드로 가시화합니다." /></div>
          <div class="field"><label>문제 설명<span class="req">*</span></label><div id="desc-mount"></div></div>
          <div class="field-row">
            <div class="field"><label>제출 시작</label><input type="datetime-local" /></div>
            <div class="field"><label>제출 마감</label><input type="datetime-local" /></div>
          </div>
          <div class="field">
            <label>제출 폼 옵션 — 학생 제출 시 필수 항목</label>
            <p class="text-mute" style="font-size:12px; margin:0 0 8px;">제목 · 한 줄 소개 · 프로젝트 설명 · 메인 이미지는 항상 필수입니다. 아래 항목의 필수 여부를 선택하세요. (체크 시 학생 제출 폼에 <span class="req">*</span> 표시 + 미입력 시 제출 차단)</p>
            <div style="display:flex; flex-direction:column; gap:10px; padding:12px 14px; background:var(--lk-color-bg-normal); border-radius:10px;">
              <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:14px;"><input type="checkbox" id="opt-url" checked /> 프로젝트 URL 필수</label>
              <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:14px;"><input type="checkbox" id="opt-vid" checked /> 시연 영상 URL 필수</label>
              <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:14px;"><input type="checkbox" id="opt-att" /> 첨부파일 필수</label>
            </div>
          </div>
          <div class="field-row">
            <div class="field"><label>피드백 시작</label><input type="datetime-local" /></div>
            <div class="field"><label>피드백 마감</label><input type="datetime-local" /></div>
          </div>
          <div class="row row-end" style="gap: 8px; margin-top: 8px;" id="actions"></div>
        </div>
      `;
      fp.body.querySelector('#round-sel').appendChild(UI.select({ options: [{ value: '기초', label: '기초' }, { value: '심화', label: '심화' }, { value: '파이널', label: '파이널' }, { value: '기타', label: '기타' }], value: '심화' }));
      fp.body.querySelector('#desc-mount').appendChild(UI.markdownEditor('', { placeholder: '배경 / 문제 정의 / 요구 사항 / 제출물 / 평가 기준' }).el);
      fp.body.querySelector('#actions').appendChild(UI.button({ label: '취소', type: 'outline', color: 'neutral', onClick: () => UI.closeFullPage() }));
      fp.body.querySelector('#actions').appendChild(UI.button({ label: '등록', icon: 'ri-add-line', type: 'solid', color: 'primary', onClick: () => {
        const req = ['제목', '소개', '설명', '이미지'];
        if (fp.body.querySelector('#opt-url').checked) req.push('URL');
        if (fp.body.querySelector('#opt-vid').checked) req.push('시연영상');
        if (fp.body.querySelector('#opt-att').checked) req.push('첨부');
        UI.closeFullPage();
        UI.toast(`회차 등록 완료 — 필수 항목: ${req.join('·')} · 학생에게 알림 발송`, 'success');
      } }));
    }
  </script>
</body>
</html>
